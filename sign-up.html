<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up Here | MHL</title>
<meta name="description" content="Sign up to play in Season 2 of the Miniature Hockey League.">
<meta name="theme-color" content="#111013">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
.signup{max-width:680px;display:grid;gap:20px}
.steam-options{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end}
.steam-option{display:grid;gap:6px;align-content:end;color:var(--muted);font-size:14px}
.steam-option .btn{width:100%}
.steam-status{min-height:1.5em;font-size:13px}
.signup .ed{background:var(--card);border-top:1px solid var(--rule);padding:24px;display:grid;gap:18px}
.signup label{display:grid;gap:6px;color:var(--ink);font-weight:500}
.signup input,.signup select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:10px 12px;min-height:46px}
.signup input:focus-visible,.signup select:focus-visible{outline:1px solid var(--gold);border-color:var(--gold)}
.signup label[hidden]{display:none}
.signup small{font-size:13px;font-weight:400;color:var(--muted)}
.picrow{display:flex;align-items:center;gap:16px}
.picrow img{width:76px;height:76px;object-fit:cover;border:1px solid var(--line);border-radius:50%;background:var(--ice)}
.picrow input{max-width:100%}
.signup-status{min-height:1.6em;color:var(--muted)}
.signup-status.success{color:var(--gold)}
.signup-status.error{color:#e08474}
@media(max-width:560px){.steam-options{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"></aside>
<div>
<header class="mtop" id="mtop"></header>
<main class="main" id="main">
<div class="ph">
  <h1>Sign Up Here</h1>
  <p>Interested in playing Season 2? Fill in your player details below.</p>
</div>
<form class="signup" id="signup">
  <div class="ed">
    <label>Type your discord username here
      <input name="discord" type="text" maxlength="80" autocomplete="nickname" required>
    </label>
    <div class="steam-options">
      <label>Steam profile link
        <input name="steam" type="url" maxlength="300" placeholder="https://steamcommunity.com/id/yourname" required>
        <small>Enter your public Steam profile URL. If it does not contain your Steam ID, you will be asked to enter it.</small>
      </label>
      <div class="steam-option">
        <span>Or sign in and add it automatically</span>
        <a class="btn" href="/auth/steam?return=%2Fsign-up">Sign in with Steam</a>
        <p id="steamStatus" class="steam-status" role="status" aria-live="polite"></p>
      </div>
    </div>
    <label id="steamIdField" hidden>17-digit Steam ID
      <input name="steamId" type="text" inputmode="numeric" maxlength="17" pattern="[0-9]{17}" autocomplete="off" title="Enter your 17-digit numeric Steam ID">
      <small>Your profile link does not include your Steam ID. Paste the 17-digit ID here.</small>
    </label>
    <label>Type your in-game name here
      <input name="name" type="text" maxlength="40" required>
    </label>
    <label>How many hours on puck do you have
      <input name="hours" type="number" min="0" max="100000" step="1" inputmode="numeric" required>
      <small>Enter a whole number of hours.</small>
    </label>
    <label>What position do you play?
      <select name="position" required>
        <option value="" selected disabled>Choose a position</option>
        <option value="Goalie">Goalie</option>
        <option value="Attacker">Attacker</option>
        <option value="Defender">Defender</option>
        <option value="Flexible">Flexible</option>
      </select>
    </label>
    <label>Would you like to be captain?
      <select name="captain" required>
        <option value="" selected disabled>Choose Yes, No, or Maybe</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
        <option value="Maybe">Maybe</option>
      </select>
    </label>
    <label>Profile picture
      <div class="picrow">
        <img id="preview" alt="Profile picture preview" hidden>
        <input id="photo" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
      </div>
      <small>Optional. PNG, JPG, WEBP, or GIF; maximum 5 MB.</small>
    </label>
    <button class="btn" id="submit" type="submit">Submit signup</button>
    <p class="signup-status" id="status" role="status" aria-live="polite"></p>
  </div>
</form>
</main>
</div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="more" id="more" hidden></div>
<dialog id="signupSuccessPopup" class="prompt-dialog" aria-labelledby="signupSuccessTitle">
  <h2 id="signupSuccessTitle">Signup received!</h2>
  <p>Your Season 2 signup is in. Would you like to visit the Season 2 Player Sign Ups page?</p>
  <div class="actions">
    <button id="goToSeasonPlayers" class="btn" type="button">Go To Season 2 players</button>
    <button id="dismissSignupSuccess" class="btn line" type="button">Dismiss</button>
  </div>
</dialog>
<script src="/standings.js"></script>
<script src="/site.js"></script>
<script>
(() => {
  const form = document.getElementById('signup');
  const fileInput = document.getElementById('photo');
  const preview = document.getElementById('preview');
  const status = document.getElementById('status');
  const steamStatus = document.getElementById('steamStatus');
  const signupSuccessPopup = document.getElementById('signupSuccessPopup');
  const steamField = form.elements.namedItem('steam');
  const steamIdField = document.getElementById('steamIdField');
  const steamIdInput = form.elements.namedItem('steamId');
  const button = document.getElementById('submit');
  const steamIdUrl = /^https:\/\/(?:www\.)?steamcommunity\.com\/profiles\/(\d{17})\/?$/i;
  const customSteamUrl = /^https:\/\/(?:www\.)?steamcommunity\.com\/id\/[a-z0-9_-]+\/?$/i;
  const steamIdMessage = 'This Steam link does not contain a Steam ID. Please enter your 17-digit Steam ID in the field below.';
  const updateSteamIdField = () => {
    const needsSteamId = customSteamUrl.test(steamField.value.trim());
    steamIdField.hidden = !needsSteamId;
    steamIdInput.required = needsSteamId;
    if (!needsSteamId) steamIdInput.value = '';
  };
  steamField.addEventListener('input', updateSteamIdField);
  updateSteamIdField();

  async function fillSteamProfile() {
    const loginStatus = new URLSearchParams(location.search).get('steam');
    if (loginStatus === 'failed') {
      steamStatus.textContent = 'Steam sign-in could not be completed. You can enter the profile link manually.';
      return;
    }
    try {
      const response = await fetch('/api/player/me', { cache: 'no-store' });
      if (!response.ok) throw new Error('Could not check Steam sign-in.');
      const player = await response.json();
      if (!player.authenticated) return;
      if (player.profileLookupFailed) {
        steamStatus.textContent = 'Steam could not resolve your profile URL. Try again later or enter it manually.';
        return;
      }
      const profileUrl = /^\d{17}$/.test(player.steamId)
        ? `https://steamcommunity.com/profiles/${player.steamId}`
        : player.profileUrl;
      if (!steamField.value || loginStatus === 'connected') steamField.value = profileUrl;
      updateSteamIdField();
      steamStatus.textContent = 'Steam profile added. You can change the link if needed.';
    } catch (error) {
      if (loginStatus === 'connected') {
        steamStatus.textContent = error.message || 'Could not load your Steam profile. Please enter the link manually.';
      }
    }
  }

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) { preview.removeAttribute('src'); preview.hidden = true; return; }
    if (file.size > 5000000) {
      fileInput.value = '';
      preview.removeAttribute('src');
      preview.hidden = true;
      status.textContent = 'That image is too large. Choose an image under 5 MB.';
      status.className = 'signup-status error';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      preview.src = reader.result;
      preview.hidden = false;
      status.textContent = '';
      status.className = 'signup-status';
    };
    reader.onerror = () => {
      status.textContent = 'Could not preview that image. Try choosing it again.';
      status.className = 'signup-status error';
    };
    reader.readAsDataURL(file);
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    button.disabled = true;
    status.textContent = 'Submitting...';
    status.className = 'signup-status';
    try {
      const values = new FormData(form);
      const steam = String(values.get('steam') || '').trim();
      const profileMatch = steam.match(steamIdUrl);
      if (!profileMatch && !customSteamUrl.test(steam)) {
        throw new Error('Enter a valid Steam Community profile URL.');
      }
      const steamId = profileMatch ? profileMatch[1] : String(values.get('steamId') || '').trim();
      if (!/^\d{17}$/.test(steamId)) throw new Error(steamIdMessage);
      let photo = '';
      const file = fileInput.files[0];
      if (file) {
        const upload = await fetch('/api/sign-up-upload', { method: 'POST', body: file });
        const uploaded = await upload.json();
        if (!upload.ok) throw new Error(uploaded.error || 'Could not upload the profile picture.');
        photo = uploaded.url;
      }
      const response = await fetch('/api/sign-up', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          discord: values.get('discord'),
          steam,
          steamId,
          name: values.get('name'),
          hours: Number(values.get('hours')),
          position: values.get('position'),
          captain: values.get('captain'),
          photo,
        }),
      });
      const result = await response.json();
      if (!response.ok) {
        if (response.status === 409) {
          form.reset();
          updateSteamIdField();
          preview.removeAttribute('src');
          preview.hidden = true;
        }
        throw new Error(result.error || 'Could not submit your signup.');
      }
      form.reset();
      updateSteamIdField();
      preview.removeAttribute('src');
      preview.hidden = true;
      if (MHL.refreshPlayerButton) {
        try { await MHL.refreshPlayerButton(); }
        catch (error) { console.error('Could not refresh the Steam profile button:', error); }
      }
      status.textContent = 'Thanks! Your Season 2 signup has been received.';
      status.className = 'signup-status success';
      signupSuccessPopup.showModal();
    } catch (error) {
      status.textContent = error.message || 'Could not submit your signup. Please try again.';
      status.className = 'signup-status error';
    } finally {
      button.disabled = false;
    }
  });
  document.getElementById('goToSeasonPlayers').addEventListener('click', () => { location.href = '/season-2-players'; });
  document.getElementById('dismissSignupSuccess').addEventListener('click', () => signupSuccessPopup.close());
  fillSteamProfile();
})();
</script>
</body>
</html>

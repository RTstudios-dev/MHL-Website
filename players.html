<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Stats | MHL</title>
<meta name="description" content="Pug and Season 2 player stats for MHL.">
<meta property="og:type" content="website">
<meta property="og:title" content="Player Stats | MHL">
<meta property="og:description" content="Pug and Season 2 player stats for MHL.">
<meta name="theme-color" content="#111013">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="app">
<aside class="side" id="side"></aside>
<div>
<header class="mtop" id="mtop"></header>
<main class="main" id="main">
<div class="ph">
  <h1>Player Stats</h1>
</div>
<div class="player-stats-top-row" id="playerStatsTopRow">
  <div class="stats-source-switch" role="group" aria-label="Stats source" id="statsSource">
    <button type="button" data-source="pug" aria-pressed="true">Pug Stats</button>
    <button type="button" data-source="season2" aria-pressed="false">Season 2 Stats</button>
  </div>
</div>
<div class="player-stats-controls" id="playerStatsControls">
  <div class="player-stats-filter-row">
    <div class="player-filter" role="group" aria-label="Player filter" id="playerFilters">
      <button type="button" data-filter="all" aria-pressed="true">All Players</button>
      <button type="button" data-filter="goalie" aria-pressed="false">Goalies</button>
      <button type="button" data-filter="skater" aria-pressed="false">Skaters</button>
    </div>
  </div>
</div>
<div id="leaders"><div class="sk"></div></div>
<section aria-labelledby="hAll" id="allBlock" hidden>
  <div class="bh"><h2 id="hAll">All players</h2></div>
  <div class="player-stats-list-toolbar">
    <label class="signup-search player-stats-search" for="playerSearch">Search players
      <input id="playerSearch" type="search" autocomplete="off">
    </label>
    <p class="player-stats-point-key" id="playerStatsPointKey">1 Goal = 1 point · 1 Assist = 1 point · 2 Saves = 1 point</p>
    <div class="player-stats-row-controls">
      <div class="player-stats-direction" role="group" aria-label="Sort direction" id="statDirection">
        <button type="button" data-direction="high" aria-pressed="true">Highest</button>
        <button type="button" data-direction="low" aria-pressed="false">Lowest</button>
      </div>
      <label for="statSelect">Sort by
        <select id="statSelect">
          <option value="p">Points</option>
          <option value="w">Wins</option>
          <option value="g">Goals</option>
          <option value="vg">Volley Goals</option>
          <option value="s">Saves</option>
          <option value="a">Assists</option>
          <option value="shots">Shots</option>
          <option value="goalPercentage">Goal Percentage</option>
          <option value="goalieGames">Goalie Games</option>
          <option value="skaterGames">Skater Games</option>
          <option value="goalPerfectGames">Games With 100% Goal Percentage</option>
          <option value="value">Value</option>
        </select>
      </label>
    </div>
  </div>
  <div id="all"></div>
</section>
</main>
</div>
</div>
<div class="player-banner-hover" id="playerBannerHover" hidden>
  <div class="player-banner-hover-canvas" id="playerBannerHoverCanvas"></div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="more" id="more" hidden></div>
<script src="/standings.js"></script>
<script src="/site.js"></script>
<script src="/player-banner.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  let D;
  try { D = await MHL.load(); } catch { return MHL.fail($('leaders'), 'the players'); }
  const { esc } = MHL;
  const rawPointRequirements = D.site && D.site.statsPointRequirements || {};
  const requirement = (value, fallback) =>
    Number.isSafeInteger(value) && value > 0 ? value : fallback;
  const goalsPerPoint = requirement(rawPointRequirements.goals, 1);
  const assistsPerPoint = requirement(rawPointRequirements.assists, 1);
  const savesPerPoint = requirement(rawPointRequirements.saves, 2);
  const pointRuleText = (value, singular, plural) =>
    `${value} ${value === 1 ? singular : plural} = 1 point`;
  let key = 'p', direction = 'high', filter = 'all', source = 'pug', search = '';
  $('playerStatsPointKey').textContent = [
    `Skaters: ${pointRuleText(goalsPerPoint, 'Goal', 'Goals')} + ${pointRuleText(assistsPerPoint, 'Assist', 'Assists')}`,
    `Goalies: ${pointRuleText(savesPerPoint, 'Save', 'Saves')} + ${pointRuleText(assistsPerPoint, 'Assist', 'Assists')}`,
  ].join(' · ');
  const P = (D.signups || []).map(player => {
    const stats = player.trackedStats || {};
    const g = Number(stats.goals) || 0, vg = Number(stats.volleyGoals) || 0;
    const a = Number(stats.assists) || 0, s = Number(stats.saves) || 0;
    const shots = Number(stats.shots) || 0;
    const w = Number(stats.wins) || 0, l = Number(stats.losses) || 0;
    return {
      ...player, g, vg, a, s, w, l,
      pugStats: stats,
      seasonTwoStats: player.season2TrackedStats || {},
      p: (player.position === 'Goalie' ? Math.floor(s / savesPerPoint) : Math.floor(g / goalsPerPoint))
        + Math.floor(a / assistsPerPoint),
      shots,
      goalPercentage: shots ? g / shots * 100 : 0,
      goalieGames: Number(stats.goalieGames) || 0,
      skaterGames: Number(stats.skaterGames) || 0,
      goalPerfectGames: Number(stats.gamesWith100PercentGoalPercentage) || 0,
      value: Number(player.position === 'Goalie' ? player.goalieValue : player.skaterValue) || 0,
      goalie: player.position === 'Goalie',
      t: D.T[player.team] || null,
    };
  });
  const bannerHover = $('playerBannerHover');
  const bannerHoverCanvas = $('playerBannerHoverCanvas');
  const hideBannerHover = () => {
    bannerHover.hidden = true;
  };
  const positionBannerHover = event => {
    if (!event || Number.isFinite(event.clientX) === false) return;
    const width = bannerHover.offsetWidth || 220;
    const height = bannerHover.offsetHeight || 311;
    const gap = 18;
    let left = event.clientX + gap;
    let top = event.clientY + gap;
    if (left + width > window.innerWidth - 10) left = event.clientX - width - gap;
    if (top + height > window.innerHeight - 10) top = event.clientY - height - gap;
    bannerHover.style.left = `${Math.max(10, left)}px`;
    bannerHover.style.top = `${Math.max(10, top)}px`;
  };
  const showBannerHover = (player, event) => {
    if (!player) return;
    const config = player.bannerConfig && typeof player.bannerConfig === 'object'
      ? player.bannerConfig : {};
    const preview = {
      ...player,
      bannerConfig: config,
      bannerDefaults: D.bannerDefaults || {},
      bannerLayers: D.bannerLayers || [],
      badges: (D.badges || []).map(badge => ({ ...badge, unlocked: true })),
      badgeSlots: config.badgeSlots || player.badgeSlots || ['', '', ''],
      backgroundSprites: D.backgroundSprites || [],
      helmetSprites: D.helmetSprites || [],
      torsoSprites: D.torsoSprites || [],
      stickSprites: D.stickSprites || [],
      puckSprites: D.puckSprites || [],
      bannerSprites: D.bannerSprites || [],
      borderSprites: D.borderSprites || [],
    };
    bannerHover.hidden = false;
    const scale = 220 / 849;
    bannerHoverCanvas.style.transform = `scale(${scale})`;
    window.MHLPlayerBanner.render(
      { clientWidth: 220 },
      bannerHoverCanvas,
      preview,
    );
    positionBannerHover(event);
  };
  const statControls = $('playerStatsControls');
  if (!P.length) {
    $('playerStatsTopRow').hidden = true;
    statControls.hidden = true;
    $('playerFilters').hidden = true;
    $('statsSource').hidden = true;
    $('leaders').innerHTML = MHL.empty('No Season 2 players yet', 'Season 2 signups appear here once they are added.');
  }
  const euroFormat = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  const compactEuroFormat = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'EUR', notation: 'compact', maximumFractionDigits: 1 });
  const playerAvatar = (player, className = '') => player.photo
    ? `<img class="${className}" src="${esc(player.photo)}" alt="">`
    : `<span class="${className} leader-avatar" aria-hidden="true">${esc((player.name || '?').slice(0, 1).toUpperCase())}</span>`;
  const formatValue = raw => {
    const value = Number(raw) || 0;
    if (!value) return '—';
    return value >= 1_000_000
      ? compactEuroFormat.format(value).replace(/([KMBT])$/, (_, suffix) => suffix.toLowerCase())
      : euroFormat.format(value);
  };
  const NAMES = {
    p: 'Points', w: 'Wins', g: 'Goals', vg: 'Volley Goals', s: 'Saves', a: 'Assists',
    shots: 'Shots', goalPercentage: 'Goal Percentage', goalieGames: 'Goalie Games',
    skaterGames: 'Skater Games', goalPerfectGames: 'Games With 100% Goal Percentage',
    value: 'Value',
  };
  const SHORT_NAMES = {
    p: 'P', w: 'W', g: 'G', vg: 'VG', s: 'S', a: 'A', shots: 'Shots',
    goalPercentage: 'Goal %', goalieGames: 'Goalie Games', skaterGames: 'Skater Games',
    goalPerfectGames: '100% Goal% Games', value: 'Value',
  };
  const applyStatsSource = () => {
    for (const player of P) {
      const stats = source === 'season2' ? player.seasonTwoStats : player.pugStats;
      player.g = Number(stats.goals) || 0;
      player.vg = Number(stats.volleyGoals) || 0;
      player.a = Number(stats.assists) || 0;
      player.s = Number(stats.saves) || 0;
      player.shots = Number(stats.shots) || 0;
      player.goalPercentage = player.shots ? player.g / player.shots * 100 : 0;
      player.goalieGames = Number(stats.goalieGames) || 0;
      player.skaterGames = Number(stats.skaterGames) || 0;
      player.goalPerfectGames = Number(stats.gamesWith100PercentGoalPercentage) || 0;
      player.w = Number(stats.wins) || 0;
      player.l = Number(stats.losses) || 0;
      player.p = (player.goalie ? Math.floor(player.s / savesPerPoint) : Math.floor(player.g / goalsPerPoint))
        + Math.floor(player.a / assistsPerPoint);
    }
  };
  const filtered = () => {
    const query = search.trim().toLocaleLowerCase();
    return P.filter(player => {
      const flexible = String(player.position || '').toLocaleLowerCase() === 'flexible';
      const matchesPosition = filter === 'all' || flexible || (filter === 'goalie' ? player.goalie : !player.goalie);
      const matchesSearch = !query || [player.name, player.discord, player.position, player.t && player.t.name]
        .some(value => String(value || '').toLocaleLowerCase().includes(query));
      return matchesPosition && matchesSearch;
    });
  };
  const compareName = (x, y) => String(x.name || '').localeCompare(String(y.name || ''));
  const isGoalieInCurrentFilter = player => player.goalie
    || (filter === 'goalie' && String(player.position || '').toLocaleLowerCase() === 'flexible');
  const valueForCurrentFilter = player => {
    const skaterValue = Number(player.skaterValue) || 0;
    const goalieValue = Number(player.goalieValue) || 0;
    return filter === 'goalie' ? goalieValue
      : filter === 'skater' ? skaterValue : Math.max(skaterValue, goalieValue);
  };
  const metricValueFor = (player, metric) => metric === 'p' ? player.p
    : metric === 'w' ? player.w
      : metric === 'g' ? player.g
        : metric === 'vg' ? player.vg
          : metric === 's' ? player.s
            : metric === 'a' ? player.a
              : metric === 'shots' ? player.shots
                : metric === 'goalPercentage' ? player.goalPercentage
                  : metric === 'goalieGames' ? player.goalieGames
                    : metric === 'skaterGames' ? player.skaterGames
                      : metric === 'goalPerfectGames' ? player.goalPerfectGames
                        : valueForCurrentFilter(player);
  const metricValue = player => metricValueFor(player, key);
  const formattedMetricValue = (player, metric = key) => {
    const value = metricValueFor(player, metric);
    return metric === 'goalPercentage' ? `${value.toFixed(1)}%`
      : metric === 'value' ? formatValue(value) : value;
  };
  const rank = () => {
    const list = [...filtered()];
    return list.sort((x, y) => (direction === 'high' ? metricValue(y) - metricValue(x) : metricValue(x) - metricValue(y))
      || valueForCurrentFilter(y) - valueForCurrentFilter(x)
      || compareName(x, y));
  };

  function leaders() {
    if (!filtered().length) {
      $('leaders').innerHTML = P.length
        ? MHL.empty('No players match your search', 'Try another player name, Discord username, position or team.')
        : MHL.empty('No Season 2 players yet', 'Season 2 signups appear here once they are added.');
      return;
    }
    if (direction === 'low') {
      $('leaders').innerHTML = '';
      return;
    }
    const list = rank().filter(player => metricValue(player) > 0);
    if (!list.length) {
      $('leaders').innerHTML = MHL.empty('No ' + NAMES[key].toLowerCase() + ' yet', 'Leaders show here once stats or values are available.');
      return;
    }
    const [one, ...rest] = list;
    $('leaders').innerHTML = `<div class="leaders">
    <div class="top1" data-player-id="${esc(one.id)}"><div class="top1-person">${playerAvatar(one, 'leader-photo featured-photo')}<div><span class="k">${leaderLabel()}</span><h2>${esc(one.name)}</h2></div></div><span class="big num">${key === 'value' ? formatValue(valueForCurrentFilter(one)) : formattedMetricValue(one)}</span></div>
    <div class="rest">${rest.slice(0, 4).map((p, i) => `<div class="lm" data-player-id="${esc(p.id)}"><span class="r">${i + 2}</span>${playerAvatar(p, 'leader-photo')}<span class="nm">${esc(p.name)}</span><span class="v">${key === 'value' ? formatValue(valueForCurrentFilter(p)) : formattedMetricValue(p)}</span></div>`).join('')
        || '<div class="lm"><span></span><span></span><span class="nm">No one else has any yet.</span><span></span></div>'}</div>
    </div>`;
  }
  const syncStatSortOptions = () => {
    const statSelect = $('statSelect');
    [...statSelect.options].forEach(option => {
      if (option.value === 'g') {
        option.hidden = filter === 'goalie';
        option.disabled = filter === 'goalie';
      }
      if (option.value === 'vg') {
        option.hidden = filter === 'goalie';
        option.disabled = filter === 'goalie';
      }
      if (option.value === 's') {
        option.hidden = filter === 'skater';
        option.disabled = filter === 'skater';
      }
    });
    if ((filter === 'goalie' && key === 'g') || (filter === 'skater' && key === 's')) {
      key = 'p';
      statSelect.value = key;
    }
  };
  const leaderLabel = () => key === 'value'
    ? `Most Valuable ${filter === 'goalie' ? 'Goalie' : filter === 'skater' ? 'Skater' : 'Player'}`
    : `${NAMES[key]} leader`;
  function table() {
    $('allBlock').hidden = false;
    const rows = rank();
    if (!rows.length) {
      $('all').innerHTML = P.length
        ? MHL.empty('No players match your search', 'Try another player name, Discord username, position or team.')
        : MHL.empty('No Season 2 players yet', 'Season 2 signups appear here once they are added.');
      return;
    }
    const statColumns = [...new Set([key, 'a', 'w'])];
    $('all').innerHTML = `<div class="tbl-wrap player-stats-wrap"><table class="tbl player-stats-table">
      <thead><tr><th class="l" scope="col">Player</th><th class="l" scope="col">Discord username</th><th scope="col">Position</th>
        <th class="l" scope="col">Team</th>${statColumns.map(stat =>
          `<th scope="col">${esc(SHORT_NAMES[stat])}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(player => `<tr data-player-id="${esc(player.id)}"><td class="l player-name-cell" data-label="Player"><span class="signup-person">${player.photo
        ? `<img src="${esc(player.photo)}" alt="">`
        : `<span class="avatar" aria-hidden="true">${esc((player.name || '?').slice(0, 1).toUpperCase())}</span>`}
        <b>${esc(player.name)}</b></span></td>
        <td class="l" data-label="Discord username">${esc(player.discord || '—')}</td>
        <td data-label="Position">${esc(player.position || 'Unassigned')}</td>
        <td class="l" data-label="Team"><span class="team">${player.t ? `${MHL.badge(player.t)}${MHL.teamLink(player.t)}` : '—'}</span></td>
        ${statColumns.map(stat => `<td class="player-stat-cell player-stat-value" data-label="${esc(NAMES[stat])}">${formattedMetricValue(player, stat)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>`;
  }
  $('statSelect').addEventListener('change', event => {
    key = event.target.value;
    leaders();
    table();
  });
  $('statDirection').addEventListener('click', event => {
    const button = event.target.closest('button[data-direction]');
    if (!button) return;
    direction = button.dataset.direction;
    $('statDirection').querySelectorAll('button').forEach(item =>
      item.setAttribute('aria-pressed', String(item === button)));
    leaders();
    table();
  });
  $('playerFilters').addEventListener('click', event => {
    const button = event.target.closest('button[data-filter]');
    if (!button) return;
    filter = button.dataset.filter;
    $('playerFilters').querySelectorAll('button').forEach(item =>
      item.setAttribute('aria-pressed', String(item === button)));
    $('hAll').textContent = button.textContent;
    syncStatSortOptions();
    leaders();
    table();
  });
  $('playerSearch').addEventListener('input', event => {
    search = event.target.value;
    leaders();
    table();
  });
  $('statsSource').addEventListener('click', event => {
    const button = event.target.closest('button[data-source]');
    if (!button) return;
    source = button.dataset.source;
    applyStatsSource();
    $('statsSource').querySelectorAll('button').forEach(item =>
      item.setAttribute('aria-pressed', String(item === button)));
    leaders();
    table();
  });
  document.addEventListener('pointerover', event => {
    const row = event.target.closest('[data-player-id]');
    if (!row) return;
    const player = P.find(item => item.id === row.dataset.playerId);
    if (!player) return;
    showBannerHover(player, event);
  });
  document.addEventListener('pointermove', event => {
    if (!bannerHover.hidden) positionBannerHover(event);
  });
  document.addEventListener('pointerout', event => {
    const row = event.target.closest('[data-player-id]');
    if (!row) return;
    if (event.relatedTarget && row.contains(event.relatedTarget)) return;
    hideBannerHover();
  });
  document.addEventListener('scroll', hideBannerHover, true);
  window.addEventListener('blur', hideBannerHover);
  syncStatSortOptions();
  leaders(); table();
})();
</script>
</body>
</html>

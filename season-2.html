<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MHL Season 2 | Miniature Hockey League</title>
<meta name="description" content="Sign up for MHL Season 2 or explore the players joining the league.">
<meta name="theme-color" content="#111013">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<main class="season-landing">
  <section class="hub-cards" aria-label="Season 2 options">
    <a class="showcase-card showcase-link showcase-season" id="season2SignupButton" href="/sign-up">
      <span class="showcase-art"><img src="/sign-up-logo.png" alt="Sign Up"></span>
      <h2>Sign Up for season 2</h2>
      <span class="showcase-tag">Claim your player banner, Start Tracking Stats, Join a team</span>
    </a>
    <a class="showcase-card showcase-link showcase-pugs" href="/season-2-players">
      <span class="showcase-art"><img src="/players-logo.png" alt="Season 2 players"></span>
      <h2>Season 2 players</h2>
      <span class="showcase-tag">View Players, Understand your competition, Plan your game</span>
    </a>
  </section>
</main>
<script>
  (async () => {
    const button = document.getElementById('season2SignupButton');
    try {
      const sessionResponse = await fetch('/api/player/me', { cache: 'no-store' });
      if (!sessionResponse.ok) throw new Error('Could not check Steam sign-in.');
      const session = await sessionResponse.json();
      if (!session.authenticated) return;

      const signupResponse = await fetch('/api/player/signup', { cache: 'no-store' });
      if (signupResponse.status === 404) return;
      if (!signupResponse.ok) throw new Error('Could not check your Season 2 signup.');
      button.hidden = true;
    } catch (error) {
      console.error('Could not update the Season 2 signup button:', error);
    }
  })();
</script>
</body>
</html>

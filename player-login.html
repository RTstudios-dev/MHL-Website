<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Season 2 Player | MHL</title>
<meta name="description" content="Sign in with Steam to edit your MHL player signup.">
<meta name="theme-color" content="#111013">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
.player-login,.player-edit{max-width:680px}
.player-edit-title{font-family:var(--disp);font-weight:500;font-size:34px;line-height:1.05;margin:44px 0 20px}
.profile-summary{max-width:680px;background:var(--card);border-top:1px solid var(--rule);padding:24px;margin-bottom:28px}
.profile-summary[hidden],.player-edit[hidden],.player-login[hidden]{display:none}
.profile-identity img[hidden],.profile-avatar-fallback[hidden]{display:none}
.profile-stats[hidden]{display:none}
#steamStatus{max-width:680px;margin-bottom:16px;color:var(--muted)}
.profile-overview,.profile-identity{display:flex;align-items:center;gap:18px}
.profile-overview{justify-content:space-between}
.profile-identity img,.profile-avatar-fallback{width:96px;height:96px;flex:none;object-fit:cover;border:1px solid var(--rule);border-radius:50%;background:var(--paper)}
.profile-avatar-fallback{display:grid;place-items:center;color:var(--gold);font-family:var(--disp);font-size:44px}
.profile-identity small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.profile-identity h2{font-family:var(--disp);font-size:32px;font-weight:500;line-height:1.05}
.player-login .ed,.player-edit .ed{background:var(--card);border-top:1px solid var(--rule);padding:24px;display:grid;gap:18px}
.player-login p,.player-edit p,.profile-summary p{color:var(--muted)}
.player-login .profile{display:inline-block;margin-top:8px;color:var(--gold);text-decoration:underline;text-underline-offset:3px}
.signup-link{color:var(--gold);text-decoration:underline;text-underline-offset:3px}
.profile-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:26px}
.profile-stats div{padding-top:12px;border-top:1px solid var(--line)}
.profile-stats span{display:block;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.profile-stats strong{font-family:var(--disp);font-size:32px;font-weight:500;color:var(--gold)}
.player-profile-status{margin-top:14px;min-height:1.5em}
.player-profile-status.error{color:#e08474}
.player-edit label{display:grid;gap:6px;color:var(--ink);font-weight:500}
.player-edit input,.player-edit select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:10px 12px;min-height:46px}
.player-edit input:focus-visible,.player-edit select:focus-visible{outline:1px solid var(--gold);border-color:var(--gold)}
.player-edit small{font-size:13px;font-weight:400;color:var(--muted)}
.photo-row{display:flex;align-items:center;gap:16px}
.photo-row img{width:76px;height:76px;object-fit:cover;border:1px solid var(--line);border-radius:50%;background:var(--ice)}
.player-status{min-height:1.6em}
.player-status.success{color:var(--gold)}
.player-status.error{color:#e08474}
@media(max-width:560px){
  .profile-identity{gap:12px}
  .profile-identity img,.profile-avatar-fallback{width:72px;height:72px}
  .profile-identity h2{font-size:26px}
  .profile-overview{align-items:flex-start}
  .profile-stats{gap:10px}
  .profile-stats strong{font-size:26px}
}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"></aside>
<div>
<header class="mtop" id="mtop"></header>
<main class="main" id="main">
<div class="ph">
  <h1>Player Profile</h1>
</div>
<p id="steamStatus" role="status" aria-live="polite">Sign in with Steam to view your player profile.</p>
<section class="profile-summary" id="profileSummary" aria-label="Player profile" hidden>
  <div class="profile-overview">
    <div class="profile-identity">
      <img id="profileAvatar" alt="" hidden>
      <span class="profile-avatar-fallback" id="profileAvatarFallback" aria-hidden="true">S</span>
      <div>
        <small>Discord username</small>
        <h2 id="profileDiscord">Steam Player</h2>
        <a class="profile" id="steamProfile" href="#" target="_blank" rel="noopener">View Steam profile</a>
      </div>
    </div>
    <button class="btn line" id="steamLogout" type="button">Sign out</button>
  </div>
  <div class="profile-stats" id="profileStats" hidden>
    <div><span>Goals</span><strong id="profileGoals">0</strong></div>
    <div><span>Assists</span><strong id="profileAssists">0</strong></div>
    <div><span>Points</span><strong id="profilePoints">0</strong></div>
  </div>
  <p class="player-profile-status" id="statsStatus" role="status" aria-live="polite"></p>
</section>
<section class="player-login" id="loginPanel" aria-label="Steam account">
  <div class="ed">
    <a class="btn" id="steamLogin" href="/auth/steam">Sign in with Steam</a>
  </div>
</section>
<h2 class="player-edit-title" id="editTitle" hidden>Season 2 Player</h2>
<a class="signup-link" id="signupLink" href="/sign-up" hidden>Sign up for Season 2</a>
<form class="player-edit" id="edit" hidden>
  <div class="ed">
    <label>Type your discord username here
      <input name="discord" type="text" maxlength="80" required>
    </label>
    <label>Type your in-game name here
      <input name="name" type="text" maxlength="40" required>
    </label>
    <label>How many hours on puck do you have
      <input name="hours" type="number" min="0" max="100000" step="1" inputmode="numeric" required>
    </label>
    <label>What position do you play?
      <select name="position" required>
        <option value="Goalie">Goalie</option>
        <option value="Attacker">Attacker</option>
        <option value="Defender">Defender</option>
        <option value="Flexible">Flexible</option>
      </select>
    </label>
    <label>Would you like to be captain?
      <select name="captain" required>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
        <option value="Maybe">Maybe</option>
      </select>
    </label>
    <label>Profile picture
      <div class="photo-row">
        <img id="photoPreview" alt="Profile picture preview" hidden>
        <input id="photo" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
      </div>
      <small>Optional. PNG, JPG, WEBP, or GIF; maximum 5 MB.</small>
    </label>
    <button class="btn" id="save" type="submit">Save signup changes</button>
    <p class="player-status" id="editStatus" role="status" aria-live="polite"></p>
  </div>
</form>
</main>
</div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="more" id="more" hidden></div>
<script src="/standings.js"></script>
<script src="/site.js"></script>
<script>
(() => {
  const form = document.getElementById('edit');
  const steamStatus = document.getElementById('steamStatus');
  const loginPanel = document.getElementById('loginPanel');
  const login = document.getElementById('steamLogin');
  const logout = document.getElementById('steamLogout');
  const profileSummary = document.getElementById('profileSummary');
  const profileAvatar = document.getElementById('profileAvatar');
  const profileAvatarFallback = document.getElementById('profileAvatarFallback');
  const profileDiscord = document.getElementById('profileDiscord');
  const profileLink = document.getElementById('steamProfile');
  const profileStats = document.getElementById('profileStats');
  const profileGoals = document.getElementById('profileGoals');
  const profileAssists = document.getElementById('profileAssists');
  const profilePoints = document.getElementById('profilePoints');
  const statsStatus = document.getElementById('statsStatus');
  const signupLink = document.getElementById('signupLink');
  const editTitle = document.getElementById('editTitle');
  const editStatus = document.getElementById('editStatus');
  const photoInput = document.getElementById('photo');
  const photoPreview = document.getElementById('photoPreview');
  const saveButton = document.getElementById('save');
  let currentPhoto = '';
  let currentSession = null;
  let currentSignup = null;
  let siteDataPromise = null;

  function showProfile(signup, session) {
    currentSignup = signup;
    currentSession = session;
    const name = signup && (signup.discord || signup.name) || 'Steam Player';
    profileDiscord.textContent = name;
    profileLink.href = session.profileUrl;
    if (signup && signup.photo) {
      profileAvatar.src = signup.photo;
      profileAvatar.hidden = false;
      profileAvatarFallback.hidden = true;
    } else {
      profileAvatar.removeAttribute('src');
      profileAvatar.hidden = true;
      profileAvatarFallback.textContent = name.trim().charAt(0).toUpperCase() || 'S';
      profileAvatarFallback.hidden = false;
    }
    profileSummary.hidden = false;
  }

  async function loadStats(signup) {
    profileStats.hidden = false;
    statsStatus.textContent = '';
    statsStatus.className = 'player-profile-status';
    try {
      if (!siteDataPromise) siteDataPromise = MHL.load();
      const data = await siteDataPromise;
      const playerName = String(signup.name || '').trim().toLowerCase();
      const rosterPlayer = data.players.find(player => String(player.name || '').trim().toLowerCase() === playerName);
      const goals = rosterPlayer ? Number(rosterPlayer.g) || 0 : 0;
      const assists = rosterPlayer ? Number(rosterPlayer.a) || 0 : 0;
      profileGoals.textContent = goals;
      profileAssists.textContent = assists;
      profilePoints.textContent = goals + assists;
      if (!rosterPlayer) statsStatus.textContent = 'Stats will appear once your in-game name is on the player roster.';
    } catch (error) {
      statsStatus.textContent = 'Could not load player stats. Please reload the page to try again.';
      statsStatus.className = 'player-profile-status error';
      console.error('Could not load player stats:', error);
    }
  }

  async function loadSignup() {
    try {
      const sessionResponse = await fetch('/api/player/me', { cache: 'no-store' });
      if (!sessionResponse.ok) throw new Error('Could not check Steam sign-in.');
      const session = await sessionResponse.json();
      if (!session.authenticated) {
        form.hidden = true;
        editTitle.hidden = true;
        profileSummary.hidden = true;
        loginPanel.hidden = false;
        login.hidden = false;
        signupLink.hidden = true;
        steamStatus.textContent = new URLSearchParams(location.search).get('steam') === 'failed'
          ? 'Steam sign-in could not be completed. Please try again.'
          : 'Sign in with Steam to view your player profile.';
        return;
      }

      loginPanel.hidden = true;
      login.hidden = true;
      showProfile(null, session);
      const response = await fetch('/api/player/signup', { cache: 'no-store' });
      const result = await response.json();
      if (response.status === 404) {
        form.hidden = true;
        editTitle.hidden = false;
        signupLink.hidden = false;
        profileStats.hidden = true;
        statsStatus.textContent = 'Complete your signup to add your Discord name and player stats here.';
        steamStatus.textContent = result.error || 'No signup was found for this Steam profile.';
        return;
      }
      if (!response.ok) throw new Error(result.error || 'Could not load your signup.');

      const signup = result.signup;
      showProfile(signup, session);
      form.elements.namedItem('discord').value = signup.discord;
      form.elements.namedItem('name').value = signup.name;
      form.elements.namedItem('hours').value = signup.hours;
      form.elements.namedItem('position').value = signup.position;
      form.elements.namedItem('captain').value = signup.captain;
      currentPhoto = signup.photo || '';
      photoPreview.src = currentPhoto;
      photoPreview.hidden = !currentPhoto;
      signupLink.hidden = true;
      loginPanel.hidden = true;
      editTitle.hidden = false;
      form.hidden = false;
      steamStatus.textContent = `Signed in as ${signup.discord}.`;
      await loadStats(signup);
    } catch (error) {
      form.hidden = true;
      editTitle.hidden = true;
      signupLink.hidden = true;
      if (currentSession) showProfile(null, currentSession);
      steamStatus.textContent = error.message || 'Could not load your signup. Please reload and try again.';
    }
  }

  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    if (!file) return;
    if (file.size > 5000000) {
      photoInput.value = '';
      editStatus.textContent = 'That image is too large. Choose an image under 5 MB.';
      editStatus.className = 'player-status error';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => { photoPreview.src = reader.result; photoPreview.hidden = false; };
    reader.onerror = () => {
      editStatus.textContent = 'Could not preview that image. Try choosing it again.';
      editStatus.className = 'player-status error';
    };
    reader.readAsDataURL(file);
  });

  logout.addEventListener('click', async () => {
    logout.disabled = true;
    try {
      const response = await fetch('/api/player/logout', { method: 'POST' });
      if (!response.ok) throw new Error('Sign out failed. Please try again.');
      location.href = '/player-login';
    } catch (error) {
      steamStatus.textContent = error.message || 'Sign out failed. Please try again.';
      logout.disabled = false;
    }
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    saveButton.disabled = true;
    editStatus.textContent = 'Saving...';
    editStatus.className = 'player-status';
    try {
      let photo = currentPhoto;
      const file = photoInput.files[0];
      if (file) {
        const upload = await fetch('/api/sign-up-upload', { method: 'POST', body: file });
        const uploaded = await upload.json();
        if (!upload.ok) throw new Error(uploaded.error || 'Could not upload the profile picture.');
        photo = uploaded.url;
      }
      const response = await fetch('/api/player/signup', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          discord: form.elements.namedItem('discord').value,
          name: form.elements.namedItem('name').value,
          hours: Number(form.elements.namedItem('hours').value),
          position: form.elements.namedItem('position').value,
          captain: form.elements.namedItem('captain').value,
          photo,
        }),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Could not save your signup.');
      currentPhoto = photo;
      currentSignup = {
        ...currentSignup,
        discord: form.elements.namedItem('discord').value,
        name: form.elements.namedItem('name').value,
        hours: Number(form.elements.namedItem('hours').value),
        position: form.elements.namedItem('position').value,
        captain: form.elements.namedItem('captain').value,
        photo,
      };
      showProfile(currentSignup, currentSession);
      await loadStats(currentSignup);
      if (MHL.refreshPlayerButton) {
        try { await MHL.refreshPlayerButton(); }
        catch (error) { console.error('Could not refresh the Steam profile button:', error); }
      }
      editStatus.textContent = 'Your signup has been updated.';
      editStatus.className = 'player-status success';
    } catch (error) {
      editStatus.textContent = error.message || 'Could not save your signup. Please try again.';
      editStatus.className = 'player-status error';
    } finally {
      saveButton.disabled = false;
    }
  });

  loadSignup();
})();
</script>
</body>
</html>

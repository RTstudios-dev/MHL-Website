<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | MHL</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
:root{--danger:#e08474}
body{font-size:15px}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:8px 10px;min-height:42px;width:100%;border-radius:0}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input[type=color]{padding:2px;width:56px}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--gold)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.f{display:grid;gap:4px;font-size:14px;font-weight:600}
.f small{font-weight:400;color:var(--muted)}
.btn.sm{min-height:38px;font-size:16px;padding:0 14px}
.btn.del{background:transparent;color:var(--danger);border-color:var(--line)}
.btn.del:hover{border-color:var(--danger);background:var(--hover);color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:16px}
.login form{width:min(380px,100%);background:var(--paper);border-top:1px solid var(--rule);padding:32px;display:grid;gap:16px}
.login h1{font-family:var(--disp);font-weight:500;font-size:44px;line-height:1}
.err{color:var(--danger);font-weight:600;min-height:1.4em}

/* top bar */
.bar{position:sticky;top:0;z-index:10;background:var(--ice);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 0}
.bar b{font-family:var(--disp);font-weight:500;font-size:28px;line-height:1}
.bar .seg{margin:0}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status{font-size:14px;color:var(--muted)}
.status.dirty{color:var(--gold);font-weight:600}
.bar a.lnk{font-size:14px;font-weight:600;color:var(--muted);text-decoration:underline}

.panel{padding:28px 0 80px}
.panel h2{font-family:var(--disp);font-weight:500;font-size:34px;line-height:1.05}
.ph2{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:10px;margin:40px 0 16px}
.ph2:first-child{margin-top:0}
.help{color:var(--muted);max-width:75ch;margin-bottom:14px}
.ed{background:var(--paper);border:1px solid var(--line);padding:16px;display:grid;gap:12px}
.ed + .ed{margin-top:12px}
.row{display:grid;gap:12px;align-items:end}
.teams-row{grid-template-columns:minmax(160px,2fr) 90px 70px minmax(140px,1.4fr)}
.team-management{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:20px;align-items:start}
.draft-order-panel{position:sticky;top:118px}
.draft-order-panel h3,.team-drafted-players h4{margin:0;font-family:var(--disp);font-weight:500;font-size:24px}
.draft-order-panel p{margin:0;color:var(--muted);font-size:13px}
.draft-order{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.draft-order-item{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;gap:8px;padding:8px;border:1px solid var(--line);background:var(--paper)}
.draft-order-item select{min-width:0}
.draft-order-number{font-family:var(--disp);font-size:20px;color:var(--gold);text-align:center}
.team-list{display:grid;gap:12px}
.team-draft-settings{display:grid;grid-template-columns:minmax(200px,1fr) minmax(200px,1fr);gap:12px;align-items:end}
.point-requirements{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.team-budget{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.team-budget b{font-family:var(--disp);font-size:23px;font-weight:500;color:var(--gold)}
.team-drafted-players{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.team-drafted-players ul{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.team-drafted-players li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.team-drafted-players li strong{font-weight:600;color:var(--gold);white-space:nowrap}
.team-drafted-players li small{display:block;color:var(--muted);font-size:12px}
.imgs{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.img{display:flex;align-items:center;gap:10px}
.img .thumb{width:56px;height:56px;border:1px solid var(--line);display:grid;place-items:center;background:var(--ice);overflow:hidden;font-size:12px;color:var(--muted)}
.img .thumb img{width:100%;height:100%;object-fit:cover}
.img input[type=file]{display:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* matches */
.match{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:12px 18px;align-items:end}
.teamsel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.teamsel .vs{padding-bottom:10px;font-family:var(--disp);font-style:italic;font-size:20px;color:var(--gold)}
.games{display:flex;gap:10px;flex-wrap:wrap}
.game{display:grid;gap:4px;font-size:13px;font-weight:600}
.game div{display:flex;align-items:center;gap:4px}
.game input{width:56px;text-align:center;padding:8px 4px}
.preview{grid-column:1/-1;font-size:15px;padding:8px 12px;background:var(--ice);border-left:2px solid var(--line);color:var(--muted)}
.preview b{color:var(--ink)}
.preview.done{border-left-color:var(--gold)}
.preview.warn{border-left-color:#b7791f}
.preview b{font-weight:700}
.rounds{display:grid;gap:8px;max-width:560px}
.rnd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}

/* goal log inside a match */
.goals{grid-column:1/-1;border:1px solid var(--line)}
.goals summary{cursor:pointer;padding:10px 12px;font-weight:500;background:var(--ice);color:var(--gold)}
.goals .body{padding:4px 12px 14px}
.goals h4{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin:16px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.goals h4 span{font-family:var(--disp);font-weight:500;font-size:24px}
.goals h4 small{font-size:14px;color:var(--muted)}
.grow{display:grid;grid-template-columns:120px repeat(3,minmax(0,1fr));gap:8px;align-items:center;padding:4px 0}
.grow.hd{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.grow .who{font-size:13px;color:var(--muted)}
.grow .who b{color:var(--gold);font-weight:600;letter-spacing:.06em;margin-right:4px}
.grow select{min-height:36px;padding:4px 8px}
.grow select.unset{color:var(--muted)}
.check{font-size:13px;color:var(--muted);margin-top:6px}
.tot{font-weight:700;text-align:center}
@media (max-width:820px){.grow{grid-template-columns:1fr 1fr}.grow .who{grid-column:1/-1}.grow.hd{display:none}}

/* players */
.ptable{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line)}
.ptable th{text-align:left;font-size:13px;color:var(--muted);padding:10px 8px 6px;border-bottom:1px solid var(--rule);letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.ptable td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptable .n{width:76px}
.pwrap{overflow-x:auto}
.ptable{min-width:1120px}
.logtable{min-width:1320px}
.logtable td{font-size:13px}
.logtable td small{display:block;color:var(--muted);max-width:260px;white-space:normal}
.logtable code{font-size:12px;white-space:nowrap}
.log-status{font-weight:600;white-space:nowrap}
.log-status.imported{color:var(--gold)}
.log-status.duplicate{color:var(--muted)}
.log-status.failed{color:var(--danger)}
.filter{max-width:280px;margin-bottom:14px}
.signup-sortbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.signup-sortbar label{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.signup-sortbar select{width:auto;min-width:220px}
.signup-sortbar .signup-search{display:grid;flex:1;max-width:300px;gap:4px}
.signup-search input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:8px 10px;min-height:42px;width:100%;border-radius:0}
.signup-table[hidden]{display:none}
.caps-edit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:640px;margin-bottom:16px}
.checkline{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.badge-admin-card{margin-top:14px}
.badge-image-picker .thumb{width:88px;height:88px;border-radius:50%}
.banner-scale-control{display:grid;gap:10px}
.banner-scale-values{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:10px;align-items:end}
.banner-scale-preview{position:relative;box-sizing:border-box;width:min(500px,100%);aspect-ratio:1;outline:1px solid var(--line);background:var(--ice);overflow:hidden}
.banner-scale-preview img{position:absolute;inset:10%;width:80%;height:80%;object-fit:contain;transform:scale(var(--asset-scale));transform-origin:center}
.banner-scale-preview-circle{position:absolute;inset:10%;box-sizing:border-box;border:1px dashed var(--gold);border-radius:50%;pointer-events:none}
.banner-component-properties{margin-top:12px}
.banner-component-properties[hidden]{display:none}
.banner-component-properties strong{font-family:var(--disp);font-size:20px;font-weight:500}
.banner-admin-section{margin-top:18px}
.banner-admin-section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.banner-admin-section-toggle{display:flex;align-items:center;gap:10px;flex:1;padding:0;border:0;background:none;color:var(--gold);cursor:pointer;text-align:left;font:inherit}
.banner-admin-section-toggle strong{font-family:var(--disp);font-size:22px;font-weight:500}
.banner-admin-section-toggle span:last-child{font-size:20px}
.banner-admin-section-content{margin-top:12px}
.banner-admin-section-content[hidden]{display:none}
.banner-component-coordinate-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.banner-component-selected{outline:2px solid var(--gold)!important;outline-offset:1px!important}
.badge-requirements{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.badge-audiences{display:flex;flex-wrap:wrap;gap:12px 24px}
.manual-badge-awards{border-top:1px solid var(--line);padding-top:10px}
.manual-badge-awards summary{cursor:pointer;color:var(--gold);font-weight:600}
.manual-badge-awards>div{max-height:240px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;padding:12px 0}
.banner-layer-editor{display:grid;grid-template-columns:220px 863px;gap:18px;align-items:start;margin:18px 0;overflow-x:auto}
.banner-layer-list{display:grid;gap:6px}
.banner-layer-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px}
.banner-layer-button{min-height:44px;padding:8px 10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-align:left;font:600 13px var(--body);cursor:grab}
.banner-layer-button.active{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.banner-layer-button.dragging{opacity:.55}
.banner-layer-button.drop-target{outline:2px solid var(--gold)}
.banner-layer-visibility{min-width:52px;padding:4px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font:500 11px var(--body);cursor:pointer}
.banner-layer-visibility[aria-pressed="false"]{color:var(--gold)}
.banner-editor-preview-toggle{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--ink);font-size:13px}
.banner-layer-canvas.preview-mode .banner-badge-guide{display:none}
.banner-layer-canvas.preview-mode .banner-layer-item,.banner-layer-canvas.preview-mode .banner-stat-guide,.banner-layer-canvas.preview-mode .banner-stat-guide-value,.banner-layer-canvas.preview-mode .banner-player-text-guide{cursor:default}
.banner-component-position{position:absolute;z-index:1000;padding:2px 4px;background:rgba(0,0,0,.88);border:1px solid var(--gold);color:#fff;font:11px/1.2 "Courier New",monospace;white-space:nowrap;pointer-events:none;transform:translateY(-100%)}
.banner-component-position:not(.banner-component-position-active){display:none}
.banner-component-position:after{content:"";position:absolute;left:-1px;top:100%;width:5px;height:5px;background:var(--gold);border:1px solid #151418;transform:translate(-50%,-50%)}
.banner-layer-canvas.preview-mode .banner-component-position{display:none}
.banner-layer-assets{display:grid;gap:6px;margin-top:10px}
.banner-layer-asset{width:100%;min-height:48px;padding:5px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;grid-template-columns:40px 1fr;align-items:center;gap:8px;text-align:left;cursor:pointer}
.banner-layer-asset img{width:40px;height:40px;object-fit:contain}
.banner-layer-asset.active{border-color:var(--gold)}
.banner-layer-canvas{position:relative;width:863px;height:1214px;overflow:hidden;border:7px solid var(--line);background:#151418;touch-action:none}
.banner-layer-item{position:absolute;z-index:2;width:260px;height:260px;left:334px;top:510px;object-fit:contain;cursor:move;user-select:none}
.banner-player-text-guide{position:absolute;z-index:100;color:#f2eee5;font:500 34px var(--disp);text-shadow:0 2px 3px #000;white-space:nowrap;cursor:move;user-select:none}
.banner-player-name-guide{transform-origin:top center}
.banner-player-value-guide{font-size:28px;color:var(--gold)}
.banner-badge-guide{position:absolute;z-index:200;box-sizing:border-box;width:500px;height:500px;border:1px dashed rgba(201,163,92,.45);border-radius:0;pointer-events:auto;cursor:move}
.banner-badge-guide:before{content:"";position:absolute;inset:10%;border:1px dashed rgba(201,163,92,.65);border-radius:50%;pointer-events:none}
.banner-stat-guide{position:absolute;z-index:300;color:var(--primary);font:500 15px var(--disp);white-space:nowrap;cursor:move;user-select:none}
.banner-stat-guide-value{position:absolute;z-index:301;color:var(--gold);font:500 64px var(--disp);cursor:move}

@media (max-width:820px){
  .teams-row{grid-template-columns:1fr 1fr}
  .team-management{grid-template-columns:1fr}
  .draft-order-panel{position:static}
  .team-draft-settings{grid-template-columns:1fr}
  .point-requirements{grid-template-columns:1fr}
  .badge-requirements{grid-template-columns:repeat(2,minmax(0,1fr))}
  .match{grid-template-columns:1fr}
  .bar .right{margin-left:0}
}
@media (max-width:560px){
  .signup-sortbar{align-items:flex-start;flex-direction:column}
  .signup-sortbar label{width:100%;align-items:flex-start;flex-direction:column}
  .signup-sortbar select{width:100%}
  .caps-edit{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="/standings.js"></script>
<script>
const MHLA = (() => {
  const root = document.getElementById('root');
  let D = null, dirty = false, tab = 'teams', playerFilter = '', signupSort = 'value-desc', signupSearch = '', trackedStatsEdits = {}, statsImportReports = null, statsImportMessage = '';
  const bannerSectionOpen = { editor: true, badges: true, background: true, helmet: true, torso: true, stick: true, puck: true };
  let statsImportLogs = null, statsImportLogsLoading = false, statsImportLogsError = '';
  const playoffMatchLimits = { quarterfinals: 4, semifinals: 2, finals: 1 };
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

  // h('div', {class: 'x', onclick: fn}, ...children)
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className = v;
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
    return el;
  }
  const field = (label, input, help) => h('label', { class: 'f' }, h('span', {}, label), input, help ? h('small', {}, help) : null);
  const scaleString = value => String(Math.round(Number(value) * 100) / 100);
  const syncBannerScaleInputs = (key, value) => {
    if (!key) return;
    document.querySelectorAll('[data-banner-scale-key]').forEach(input => {
      if (input.dataset.bannerScaleKey !== key) return;
      input.setCustomValidity('');
      input.value = input.type === 'range' ? String(Math.round(value * 100)) : scaleString(value);
    });
  };
  const bannerScaleControl = (image, scale, onScaleChange, scaleKey) => {
    let numberInput;
    const slider = h('input', {
      type: 'range', min: 10, max: 500,
      value: Math.round(scale * 100),
      'aria-label': 'Display scale',
      'data-banner-scale-key': scaleKey,
      oninput: event => {
        numberInput.setCustomValidity('');
        numberInput.value = scaleString(Number(event.target.value) / 100);
      },
      onchange: event => onScaleChange(Number(event.target.value) / 100),
    });
    numberInput = h('input', {
      type: 'number', min: 0.1, max: 5, step: 0.01,
      value: scaleString(scale),
      'aria-label': 'Display scale factor',
      'data-banner-scale-key': scaleKey,
      oninput: event => event.target.setCustomValidity(''),
      onchange: event => {
        const value = Number(event.target.value);
        if (!event.target.value || !Number.isFinite(value) || value < 0.1 || value > 5) {
          event.target.setCustomValidity('Enter a scale factor from 0.1 to 5.');
          event.target.reportValidity();
          event.target.value = scaleString(scale);
          return;
        }
        onScaleChange(value);
      },
    });
    return h('div', { class: 'f' },
      h('span', {}, 'Display scale'),
      h('div', { class: 'banner-scale-control' },
        h('div', { class: 'banner-scale-values' },
          slider,
          h('div', { class: 'f' }, h('span', {}, 'Scale factor (×)'), numberInput)),
        h('div', {
          class: 'banner-scale-preview',
          role: 'img',
          'aria-label': '500 by 500 scale preview with a centered 400 by 400 circle guide',
        },
          image ? h('img', { src: image, alt: '', style: `--asset-scale:${scale}` }) : null,
          h('div', { class: 'banner-scale-preview-circle', 'aria-hidden': 'true' }))),
      h('small', {}, 'Sets the size used on player cards. The circle is an editor-only 400 × 400 guide.'));
  };
  const text = (obj, key, attrs = {}) => h('input', { type: 'text', value: obj[key] ?? '', ...attrs, oninput: e => { obj[key] = e.target.value; touch(); attrs.after && attrs.after(); } });
  const teamName = id => (D.teams.find(t => t.id === id) || {}).name || 'Unknown team';
  const playoffMatchCount = stage => {
    const roundIds = new Set(D.rounds.filter(round => round.playoffStage === stage).map(round => round.id));
    return D.matches.filter(match => roundIds.has(match.round)).length;
  };
  const steamIdInUrl = value => {
    const match = String(value || '').trim().match(/^https:\/\/(?:www\.)?steamcommunity\.com\/profiles\/(\d{17})\/?$/i);
    return match ? match[1] : '';
  };
  const signupSteamId = signup => steamIdInUrl(signup.steam) || (/^\d{17}$/.test(signup.steamId || '') ? signup.steamId : '');
  const manualSteamIdInput = signup => h('input', {
    type: 'text', inputmode: 'numeric', maxlength: 17,
    'aria-label': `Steam ID for ${signup.name}`,
    value: signup.steamId || '',
    oninput: e => {
      const value = e.target.value.replace(/\D/g, '').slice(0, 17);
      signup.steamId = value;
      e.target.value = value;
      touch();
    },
  });
  const steamUrlInput = signup => h('input', {
    type: 'text', maxlength: 300,
    'aria-label': `Steam profile link for ${signup.name}`,
    value: signup.steam || '',
    oninput: e => {
      signup.steam = e.target.value;
      touch();
      const cell = e.target.closest('tr').querySelector('[data-manual-steam-id]');
      if (!cell) return;
      if (steamIdInUrl(signup.steam)) {
        signup.steamId = '';
        cell.replaceChildren(document.createTextNode('—'));
      } else {
        cell.replaceChildren(manualSteamIdInput(signup));
      }
    },
  });

  function touch() {
    dirty = true;
    const s = document.getElementById('status');
    if (s) { s.textContent = 'Unsaved changes'; s.className = 'status dirty'; }
    const b = document.getElementById('saveBtn'); if (b) b.disabled = false;
  }
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  // login
  function login(msg) {
    const err = h('p', { class: 'err', role: 'alert' }, msg || '');
    const pw = h('input', { type: 'password', id: 'pw', autocomplete: 'current-password', required: true });
    const form = h('form', { onsubmit: async e => {
      e.preventDefault(); err.textContent = '';
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw.value }) });
      if (r.ok) return start();

  async function downloadSiteBackup(button) {
    const status = document.getElementById('backupStatus');
    button.disabled = true;
    if (status) {
      status.className = 'help';
      status.textContent = 'Preparing backup...';
    }

    try {
      const response = await fetch('/api/admin/backup', { cache: 'no-store' });
      if (response.status === 401)
        return login('Your admin session ended. Log in again to download a backup.');
      if (!response.ok) {
        const result = await response.json().catch(() => ({}));
        throw new Error(result.error || 'Could not create the site backup.');
      }

      const downloadUrl = URL.createObjectURL(await response.blob());
      const link = document.createElement('a');
      link.href = downloadUrl;
      link.download = 'mhl-site-backup.json';
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
      if (status) status.textContent = 'Backup downloaded.';
    } catch (error) {
      console.error('Could not download site backup:', error);
      if (status) {
        status.className = 'help err';
        status.textContent = 'Backup download failed: ' + (error.message || 'Please try again.');
      }
    } finally {
      button.disabled = false;
    }
  }

  async function imageDimensions(source) {
    const dimensions = await new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve({ width: image.naturalWidth, height: image.naturalHeight });
      image.onerror = () => reject(new Error('The uploaded PNG could not be decoded.'));
      image.src = source;
    });
    if (dimensions.width > 10000 || dimensions.height > 10000)
      throw new Error('PNG dimensions cannot exceed 10000 pixels.');
    return dimensions;
  }

    const averageValue = key => {
      const valueOf = (signup, valueKey) => Number(signup[valueKey] ?? signup.value) || 0;

        ? signup.position === 'Goalie'

      if (!eligible.length) return '—';
      const average = eligible.reduce((sum, signup) => sum + valueOf(signup, key), 0) / eligible.length;
      return averageValueFormat.format(Math.ceil(average / 100000) * 100000);
    };

  // player-banner sprites
  function bannerLayerEditor() {
    D.bannerDefaults = D.bannerDefaults && typeof D.bannerDefaults === 'object'
      ? D.bannerDefaults : {};
    D.bannerLayers = Array.isArray(D.bannerLayers) ? D.bannerLayers : [];
    const canvasWidth = 849;
    const canvasHeight = 1200;
    const previousCanvasVersion = Number(D.bannerDefaults.canvasVersion) || 0;
    const badgeScaleRatio = 184 / 400;
    const defaultBadgeTransforms = [50, 332, 614].map(x => ({ x, y: 180, scale: 1 }));
    const defaultStatTransforms = [760, 900, 1040].map(y => ({ x: 50, y, scale: 1 }));
    const defaultStatValueTransforms = [803, 943, 1083].map(y => ({ x: 50, y, scale: 1 }));
    const normalizeTransform = (value, fallback, migrateLegacy, minScale = 0.1) => {
      const transform = value && typeof value === 'object' ? value : {};
      let x = Number(transform.x);
      let y = Number(transform.y);
      const scale = Math.max(minScale, Math.min(5, Number(transform.scale) || 1));
      if (!Number.isFinite(x) || !Number.isFinite(y)) return { ...fallback, scale };
      if (migrateLegacy && Math.abs(x) <= 2 && Math.abs(y) <= 2)
        return { ...fallback, scale };
      if (migrateLegacy && !(x === 334 && y === 510)) {
        x *= canvasWidth / 590;
        y *= canvasHeight / 939;
      }
      return {
        x: Math.max(-canvasWidth, Math.min(canvasWidth * 2, x)),
        y: Math.max(-canvasHeight, Math.min(canvasHeight * 2, y)),
        scale,
      };
    };
    const normalizePositions = (key, defaults, minScale = 0.1) => {
      const values = Array.isArray(D.bannerDefaults[key]) ? D.bannerDefaults[key].slice(0, 3) : [];
      D.bannerDefaults[key] = defaults.map((fallback, index) =>
        normalizeTransform(values[index], fallback, previousCanvasVersion < 2, minScale));
    };
    normalizePositions('badgeTransforms', defaultBadgeTransforms, 0.02);
    if (previousCanvasVersion < 6) {
      D.bannerDefaults.badgeTransforms = D.bannerDefaults.badgeTransforms.map(transform => {
        const scale = transform.scale * badgeScaleRatio;
        const inset = (500 - 400) * scale / 2;
        return { x: transform.x - inset, y: transform.y - inset, scale };
      });
    }
    normalizePositions('statTransforms', defaultStatTransforms);
    normalizePositions('statValueTransforms', defaultStatValueTransforms);
    const playerNameTransform = previousCanvasVersion < 2
      ? { x: 50, y: 45, scale: 1 }
      : normalizeTransform(D.bannerDefaults.playerNameTransform, { x: 50, y: 45, scale: 1 }, false);
    D.bannerDefaults.playerNameTransform = previousCanvasVersion < 5
      ? { ...playerNameTransform, x: canvasWidth / 2 }
      : playerNameTransform;
    D.bannerDefaults.playerValueTransform = previousCanvasVersion < 2
      ? { x: 50, y: 120, scale: 1 }
      : normalizeTransform(D.bannerDefaults.playerValueTransform, { x: 50, y: 120, scale: 1 }, false);
    let activeLayer = 'background';
    let draggedLayerKey = '';
    let pointerLayerDrag = null;
    let suppressLayerClick = false;
    let showEditorGuides = true;
    const hiddenEditorLayers = new Set();
    const categoryMap = {
      background: ['backgroundSprites', 'Background'],
      badges: ['badges', 'Badges'],
      stick: ['stickSprites', 'Stick'],
      torso: ['torsoSprites', 'Torso'],
      puck: ['puckSprites', 'Puck'],
      helmet: ['helmetSprites', 'Helmets'],
    };
    const wrapper = h('div', { class: 'banner-layer-editor' });
    const left = h('div', {});
    const canvas = h('div', { class: 'banner-layer-canvas' });
    const layerButtons = h('div', { class: 'banner-layer-list' });
    const assets = h('div', { class: 'banner-layer-assets' });
    const componentProperties = h('div', { class: 'ed banner-component-properties' });
    let selectedComponent = null;
    const syncSelectedPositionFields = () => {
      if (!selectedComponent) return;
      componentProperties.querySelectorAll('[data-component-axis]').forEach(input => {
        if (input.dataset.componentKey !== selectedComponent.key) return;
        input.value = String(Math.round(Number(selectedComponent.transform[input.dataset.componentAxis]) || 0));
      });
    };
    const renderComponentProperties = () => {
      componentProperties.hidden = !showEditorGuides;
      componentProperties.replaceChildren(h('strong', {}, 'Component controls'));
      if (!selectedComponent) {
        componentProperties.append(h('p', { class: 'help', style: 'margin:0' }, 'Select a component on the canvas to edit its position and scale.'));
        return;
      }
      const component = selectedComponent;
      const update = (property, input) => {
        const value = Number(input.value);
        const min = property === 'scale'
          ? component.key.startsWith('badge-slot:') ? 0.02 : 0.1
          : property === 'x' ? -canvasWidth : -canvasHeight;
        const max = property === 'scale' ? 5 : property === 'x' ? canvasWidth * 2 : canvasHeight * 2;
        if (!input.value || !Number.isFinite(value) || value < min || value > max) {
          input.setCustomValidity(property === 'scale'
            ? `Enter a scale factor from ${min} to 5.`
            : `Enter a position from ${min} to ${max} pixels.`);
          input.reportValidity();
          input.value = scaleString(component.transform[property]);
          return;
        }
        input.setCustomValidity('');
        component.transform[property] = property === 'scale' ? value : Math.round(value);
        if (property === 'scale') syncBannerScaleInputs(component.scaleKey, value);
        touch();
        renderCanvasAssets();
      };
      const positionInput = axis => h('input', {
        type: 'number',
        min: axis === 'x' ? -canvasWidth : -canvasHeight,
        max: axis === 'x' ? canvasWidth * 2 : canvasHeight * 2,
        step: 1,
        value: component.transform[axis],
        'data-component-key': component.key,
        'data-component-axis': axis,
        'aria-label': `${axis.toUpperCase()} position for ${component.name}`,
        oninput: event => event.target.setCustomValidity(''),
        onchange: event => update(axis, event.target),
      });
      const scaleInput = h('input', {
        type: 'number',
        min: component.key.startsWith('badge-slot:') ? 0.02 : 0.1,
        max: 5,
        step: 0.01,
        value: scaleString(component.transform.scale),
        'aria-label': `Scale factor for ${component.name}`,
        oninput: event => event.target.setCustomValidity(''),
        onchange: event => update('scale', event.target),
      });
      componentProperties.append(
        h('div', {}, component.name),
        h('div', { class: 'banner-component-coordinate-fields' },
          field('X (px)', positionInput('x')),
          field('Y (px)', positionInput('y'))),
        field('Scale factor (×)', scaleInput),
        h('p', { class: 'help', style: 'margin:0' }, 'X/Y locate the component’s top-left corner; the canvas origin is (0, 0).'),
      );
    };
    const selectComponent = (key, name, transform, scaleKey = key) => {
      selectedComponent = { key, name, transform, scaleKey };
      canvas.querySelectorAll('.banner-component-selected').forEach(element => element.classList.remove('banner-component-selected'));
      const selectedElement = [...canvas.children].find(element => element.dataset.componentKey === key);
      if (selectedElement) selectedElement.classList.add('banner-component-selected');
      canvas.querySelectorAll('.banner-component-position').forEach(label => {
        label.classList.toggle('banner-component-position-active', label.dataset.componentKey === key);
      });
      renderComponentProperties();
    };
    const addCanvasComponent = (element, key, name, transform, scaleKey = key) => {
      element.dataset.componentKey = key;
      if (selectedComponent && selectedComponent.key === key && showEditorGuides)
        element.classList.add('banner-component-selected');
      canvas.append(element);
      if (showEditorGuides) makeDraggable(element, transform, key, name, scaleKey);
    };
    const defaultLayerOrder = ['badges', 'stick', 'torso', 'puck', 'helmet', 'background'];
    const getLayerOrder = () => {
      const validKeys = new Set([
        ...Object.keys(categoryMap),
        ...D.bannerLayers.map(item => 'custom:' + item.id),
      ]);
      const order = Array.isArray(D.bannerDefaults.layerOrder)
        ? D.bannerDefaults.layerOrder.filter((key, index, values) => validKeys.has(key) && values.indexOf(key) === index)
        : [];
      for (const key of defaultLayerOrder)
        if (!order.includes(key)) order.push(key);
      for (const item of D.bannerLayers) {
        const key = 'custom:' + item.id;
        if (!order.includes(key)) order.unshift(key);
      }
      D.bannerDefaults.layerOrder = order;
      return order;
    };
    const reorderLayers = (sourceKey, targetKey) => {
      const order = getLayerOrder();
      const sourceIndex = order.indexOf(sourceKey);
      const targetIndex = order.indexOf(targetKey);
      if (sourceIndex < 0 || targetIndex < 0 || sourceIndex === targetIndex) return;
      order.splice(sourceIndex, 1);
      order.splice(targetIndex, 0, sourceKey);
      D.bannerDefaults.layerOrder = order;
      touch();
      renderLayerButtons();
      renderCanvasAssets();
    };
    const selectLayerComponent = layer => {
      selectedComponent = null;
      canvas.querySelectorAll('.banner-component-selected').forEach(element => element.classList.remove('banner-component-selected'));
      canvas.querySelectorAll('.banner-component-position-active').forEach(element => element.classList.remove('banner-component-position-active'));
      if (layer.startsWith('custom:')) {
        const item = D.bannerLayers.find(entry => entry.id === layer.slice(7));
        if (item) selectComponent(layer, item.name || 'Card layer', layerTransform(item), layer);
        else renderComponentProperties();
        return;
      }
      if (layer === 'badges') {
        const transform = D.bannerDefaults.badgeTransforms[0];
        selectComponent('badge-slot:0', 'Badge slot 1', transform);
        return;
      }
      const [collectionKey, title] = categoryMap[layer];
      const items = D[collectionKey] = Array.isArray(D[collectionKey]) ? D[collectionKey] : [];
      const defaultKey = layer === 'background' ? 'background'
        : layer === 'helmet' ? 'helmet'
        : layer === 'torso' ? 'torso'
        : layer === 'stick' ? 'stick'
        : 'puck';
      const selected = items.find(item => item.id === D.bannerDefaults[defaultKey] && item.image)
        || items.find(item => item.image)
        || items.find(item => item.id === D.bannerDefaults[defaultKey])
        || items[0];
      if (selected)
        selectComponent(`sprite:${selected.id}`, selected.name || title, layerTransform(selected), `sprite:${selected.id}`);
      else renderComponentProperties();
    };
    const setActiveLayer = layer => {
      activeLayer = layer;
      selectLayerComponent(layer);
      renderLayerButtons();
      renderAssets();
    };

    const applyTransform = (element, transform) => {
      const scale = Math.max(0.1, Math.min(5, Number(transform.scale) || 1));
      const x = Number(transform.x) || 0;
      const y = Number(transform.y) || 0;
      element.style.width = `${Math.round(260 * scale)}px`;
      element.style.height = `${Math.round(260 * scale)}px`;
      element.style.left = `${Math.round(x)}px`;
      element.style.top = `${Math.round(y)}px`;
    };
    const applyGuideTransform = (element, transform, minScale = 0.1) => {
      const scale = Math.max(minScale, Math.min(5, Number(transform.scale) || 1));
      element.style.left = `${Number(transform.x) || 0}px`;
      element.style.top = `${Number(transform.y) || 0}px`;
      element.style.transform = `scale(${scale})`;
      element.style.transformOrigin = 'top left';
    };
    const applyPlayerNameTransform = (element, transform) => {
      const scale = Math.max(0.1, Math.min(5, Number(transform.scale) || 1));
      element.style.left = `${Number(transform.x) || 0}px`;
      element.style.top = `${Number(transform.y) || 0}px`;
      element.style.transform = `translateX(-50%) scale(${scale})`;
      element.style.transformOrigin = 'top center';
    };

    const makeDraggable = (element, transform, key, name, scaleKey = key) => {
      let dragging = false;
      let pointerOffsetX = 0;
      let pointerOffsetY = 0;
      const positionLabel = showEditorGuides
        ? h('div', { class: 'banner-component-position', 'data-component-key': key, 'aria-hidden': 'true' })
        : null;
      if (positionLabel && selectedComponent && selectedComponent.key === key)
        positionLabel.classList.add('banner-component-position-active');
      const updatePositionLabel = () => {
        if (!positionLabel) return;
        const x = Math.round(Number(transform.x) || 0);
        const y = Math.round(Number(transform.y) || 0);
        positionLabel.textContent = `X: ${x}  Y: ${y}`;
        positionLabel.style.left = `${x}px`;
        positionLabel.style.top = `${y}px`;
      };
      const getCanvasPoint = event => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvasWidth / (rect.width * canvas.clientWidth / canvas.offsetWidth);
        const scaleY = canvasHeight / (rect.height * canvas.clientHeight / canvas.offsetHeight);
        const borderLeft = canvas.clientLeft * rect.width / canvas.offsetWidth;
        const borderTop = canvas.clientTop * rect.height / canvas.offsetHeight;
        return {
          x: (event.clientX - rect.left - borderLeft) * scaleX,
          y: (event.clientY - rect.top - borderTop) * scaleY,
        };
      };
      if (positionLabel) {
        updatePositionLabel();
        canvas.append(positionLabel);
      }
      element.addEventListener('pointerdown', event => {
        dragging = true;
        selectComponent(key, name, transform, scaleKey);
        const point = getCanvasPoint(event);
        pointerOffsetX = point.x - (Number(transform.x) || 0);
        pointerOffsetY = point.y - (Number(transform.y) || 0);
        element.setPointerCapture(event.pointerId);
        event.preventDefault();
      });
      element.addEventListener('pointermove', event => {
        if (!dragging) return;
        const point = getCanvasPoint(event);
        transform.x = Math.round(Math.max(-canvasWidth, Math.min(canvasWidth * 2, point.x - pointerOffsetX)));
        transform.y = Math.round(Math.max(-canvasHeight, Math.min(canvasHeight * 2, point.y - pointerOffsetY)));
        element.style.left = `${Math.round(transform.x)}px`;
        element.style.top = `${Math.round(transform.y)}px`;
        updatePositionLabel();
        syncSelectedPositionFields();
        touch();
      });
      element.addEventListener('pointerup', event => {
        dragging = false;
        if (element.hasPointerCapture(event.pointerId)) element.releasePointerCapture(event.pointerId);
      });
    };

    const normalizedLayerTransformItems = new WeakSet();
    const layerTransform = item => {
      if (normalizedLayerTransformItems.has(item)) return item.transform;
      const fallback = { x: 334, y: 510, scale: 1 };
      const transform = normalizeTransform(item.transform, fallback, previousCanvasVersion < 2);
      if (item.transform && typeof item.transform === 'object')
        Object.assign(item.transform, transform);
      else item.transform = transform;
      normalizedLayerTransformItems.add(item);
      return item.transform;
    };
    const renderLayerImage = (item, zIndex) => {
      if (!item.image) return;
      const image = h('img', {
        src: item.image,
        alt: '',
        class: 'banner-layer-item',
        style: `z-index:${zIndex}`,
      });
      const transform = layerTransform(item);
      const sizeImage = () => {
        const width = Number(item.naturalWidth) || image.naturalWidth || 260;
        const height = Number(item.naturalHeight) || image.naturalHeight || 260;
        if (!item.naturalWidth || !item.naturalHeight) {
          item.naturalWidth = width;
          item.naturalHeight = height;
          transform.x = (canvasWidth - width) / 2;
          transform.y = (canvasHeight - height) / 2;
          touch();
        }
        const scale = Math.max(0.1, Math.min(5, Number(transform.scale) || 1));
        image.style.width = `${width * scale}px`;
        image.style.height = `${height * scale}px`;
        image.style.left = `${Number(transform.x) || 0}px`;
        image.style.top = `${Number(transform.y) || 0}px`;
      };
      image.addEventListener('load', sizeImage);
      applyTransform(image, transform);
      addCanvasComponent(image, `sprite:${item.id}`, item.name || 'Banner sprite', transform, `sprite:${item.id}`);
      if (image.complete && image.naturalWidth) sizeImage();
    };
    const renderCustomLayerImage = (item, zIndex) => {
      if (!item.image) return;
      const image = h('img', {
        src: item.image,
        alt: '',
        class: 'banner-layer-item',
        style: `z-index:${zIndex}`,
      });
      const sizeImage = () => {
        const width = Number(item.naturalWidth) || image.naturalWidth || 260;
        const height = Number(item.naturalHeight) || image.naturalHeight || 260;
        let migratedDimensions = false;
        if (!item.naturalWidth || !item.naturalHeight) {
          item.naturalWidth = width;
          item.naturalHeight = height;
          item.transform.x = (canvasWidth - width) / 2;
          item.transform.y = (canvasHeight - height) / 2;
          migratedDimensions = true;
        }
        const scale = Math.max(0.1, Math.min(5, Number(item.transform.scale) || 1));
        image.style.width = `${width * scale}px`;
        image.style.height = `${height * scale}px`;
        image.style.left = `${Number(item.transform.x) || 0}px`;
        image.style.top = `${Number(item.transform.y) || 0}px`;
        if (migratedDimensions) touch();
      };
      image.addEventListener('load', sizeImage);
      applyTransform(image, layerTransform(item));
      addCanvasComponent(image, `custom:${item.id}`, item.name || 'Card layer', item.transform, `custom:${item.id}`);
      if (image.complete && image.naturalWidth) sizeImage();
    };
    const renderCanvasAssets = () => {
      canvas.classList.toggle('preview-mode', !showEditorGuides);
      canvas.querySelectorAll('.banner-layer-item,.banner-badge-guide,.banner-stat-guide,.banner-stat-guide-value,.banner-player-text-guide,.banner-component-position').forEach(item => item.remove());
      const layerOrder = getLayerOrder();
      layerOrder.forEach((layerKey, index) => {
        const zIndex = 10 + layerOrder.length - index;
        if (showEditorGuides && hiddenEditorLayers.has(layerKey)) return;

          if (item) renderCustomLayerImage(item, zIndex);
          return;
        }
        if (layerKey === 'badges') return;
        const [key] = categoryMap[layerKey];
        const items = D[key] = Array.isArray(D[key]) ? D[key] : [];
        const defaultId = D.bannerDefaults[

          : layerKey === 'helmet' ? 'helmet'
          : layerKey === 'torso' ? 'torso'
          : layerKey === 'stick' ? 'stick'
          : 'puck'
        ];
        const selected = items.find(item => item.id === defaultId && item.image)
          || items.find(item => item.image);
        if (selected) renderLayerImage(selected, zIndex);
      });
      const defaultBadge = D.badges.find(item => item.id === D.bannerDefaults.badge && item.image);
      if (defaultBadge && (!showEditorGuides || !hiddenEditorLayers.has('badges'))) {
        const transform = D.bannerDefaults.badgeTransforms[0];
        const scale = badgeScaleRatio * Math.max(0.1, Math.min(5,
          (Number(defaultBadge.scale) || 1) * (transform.scale / badgeScaleRatio)));
        const frameSize = 500 * transform.scale;
        const imageSize = 400 * scale;
        const badge = h('img', {
          src: defaultBadge.image,
          alt: '',
          class: 'banner-layer-item',
          style: `z-index:${showEditorGuides ? 199 : 200}`,

        badge.style.height = `${imageSize}px`;
        badge.style.left = `${transform.x + (frameSize - imageSize) / 2}px`;
        badge.style.top = `${transform.y + (frameSize - imageSize) / 2}px`;
        canvas.append(badge);
      }

      if (showEditorGuides) {
        const playerName = h('div', { class: 'banner-player-text-guide banner-player-name-guide' }, 'Player Name');
        applyPlayerNameTransform(playerName, D.bannerDefaults.playerNameTransform);
        addCanvasComponent(playerName, 'player-name', 'Player name', D.bannerDefaults.playerNameTransform);

        const playerValue = h('div', { class: 'banner-player-text-guide banner-player-value-guide' }, 'Player Value');
        applyGuideTransform(playerValue, D.bannerDefaults.playerValueTransform);
        addCanvasComponent(playerValue, 'player-value', 'Player value', D.bannerDefaults.playerValueTransform);

        for (let index = 0; index < 3; index++) {
          const badgeTransform = D.bannerDefaults.badgeTransforms[index];
          if (!hiddenEditorLayers.has('badges')) {
            const badgeGuide = h('div', {
              class: 'banner-badge-guide',
              title: `Badge slot ${index + 1}`,

            badgeGuide.style.width = '500px';
            badgeGuide.style.height = '500px';
            applyGuideTransform(badgeGuide, badgeTransform, 0.02);
            addCanvasComponent(badgeGuide, `badge-slot:${index}`, `Badge slot ${index + 1}`, badgeTransform);
          }

          const statTransform = D.bannerDefaults.statTransforms[index];
          const label = h('div', { class: 'banner-stat-guide' }, ['Goals', 'Assists', 'Saves'][index]);
          applyGuideTransform(label, statTransform);
          addCanvasComponent(label, `stat-label:${index}`, `${['Goals', 'Assists', 'Saves'][index]} label`, statTransform);

          const value = h('div', { class: 'banner-stat-guide-value' }, '0');
          const valueTransform = D.bannerDefaults.statValueTransforms[index];
          applyGuideTransform(value, valueTransform);
          addCanvasComponent(value, `stat-value:${index}`, `${['Goals', 'Assists', 'Saves'][index]} value`, valueTransform);
        }
      }
      renderComponentProperties();
    };

    const renderLayerButtons = () => {
      layerButtons.replaceChildren();
      for (const layerKey of getLayerOrder()) {
        const custom = layerKey.startsWith('custom:');
        const layer = custom
          ? D.bannerLayers.find(item => item.id === layerKey.slice(7))
          : null;
        const title = custom
          ? (layer && layer.name || 'New layer')
          : categoryMap[layerKey][1];
        const button = h('button', {
          type: 'button',
          draggable: 'true',
          'data-layer-key': layerKey,
          class: `banner-layer-button${activeLayer === layerKey ? ' active' : ''}`,
          onclick: () => {
            if (suppressLayerClick) return;
            setActiveLayer(layerKey);
          },
        }, title);
        button.addEventListener('pointerdown', event => {
          if (event.button !== 0) return;
          pointerLayerDrag = { key: layerKey, pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, moved: false };
          button.setPointerCapture(event.pointerId);
        });
        button.addEventListener('pointermove', event => {
          if (!pointerLayerDrag || pointerLayerDrag.pointerId !== event.pointerId) return;
          if (!pointerLayerDrag.moved && Math.hypot(event.clientX - pointerLayerDrag.startX, event.clientY - pointerLayerDrag.startY) < 5) return;
          pointerLayerDrag.moved = true;
          button.classList.add('dragging');
          layerButtons.querySelectorAll('.drop-target').forEach(item => item.classList.remove('drop-target'));
          const target = document.elementFromPoint(event.clientX, event.clientY)?.closest('.banner-layer-button');
          if (target && layerButtons.contains(target)) target.classList.add('drop-target');
        });
        button.addEventListener('pointerup', event => {
          if (!pointerLayerDrag || pointerLayerDrag.pointerId !== event.pointerId) return;
          const drag = pointerLayerDrag;
          const target = drag.moved ? document.elementFromPoint(event.clientX, event.clientY)?.closest('.banner-layer-button') : null;
          pointerLayerDrag = null;
          layerButtons.querySelectorAll('.dragging, .drop-target').forEach(item => item.classList.remove('dragging', 'drop-target'));
          if (drag.moved) {
            suppressLayerClick = true;
            if (target && layerButtons.contains(target)) reorderLayers(drag.key, target.dataset.layerKey);
            setTimeout(() => { suppressLayerClick = false; }, 0);
          }
        });
        button.addEventListener('pointercancel', () => {
          pointerLayerDrag = null;
          layerButtons.querySelectorAll('.dragging, .drop-target').forEach(item => item.classList.remove('dragging', 'drop-target'));
        });
        button.addEventListener('dragstart', event => {
          event.preventDefault();
          draggedLayerKey = layerKey;
          event.dataTransfer.setData('text/plain', layerKey);
          event.dataTransfer.effectAllowed = 'move';
          button.classList.add('dragging');
        });
        button.addEventListener('dragend', () => {
          draggedLayerKey = '';
          button.classList.remove('dragging');
          layerButtons.querySelectorAll('.drop-target').forEach(item => item.classList.remove('drop-target'));
        });
        button.addEventListener('dragover', event => {
          event.preventDefault();
          button.classList.add('drop-target');
        });
        button.addEventListener('dragleave', () => button.classList.remove('drop-target'));
        button.addEventListener('drop', event => {
          event.preventDefault();
          button.classList.remove('drop-target');
          const draggedKey = draggedLayerKey || event.dataTransfer.getData('text/plain');
          if (draggedKey) reorderLayers(draggedKey, layerKey);
        });
        const visible = !hiddenEditorLayers.has(layerKey);
        const visibilityButton = h('button', {
          type: 'button',
          class: 'banner-layer-visibility',
          'aria-label': `${visible ? 'Hide' : 'Show'} ${title} in editor`,
          'aria-pressed': String(visible),
          disabled: !showEditorGuides,
          onclick: () => {
            if (visible) hiddenEditorLayers.add(layerKey);
            else hiddenEditorLayers.delete(layerKey);
            renderLayerButtons();
            renderCanvasAssets();
          },
        }, visible ? 'Hide' : 'Show');
        const row = h('div', { class: 'banner-layer-row' }, button, visibilityButton);
        layerButtons.append(row);
      }
    };

    const renderAssets = () => {
      assets.replaceChildren();
      if (activeLayer.startsWith('custom:')) {
        const item = D.bannerLayers.find(layer => layer.id === activeLayer.slice(7));
        if (!item) {
          activeLayer = 'background';
          renderLayerButtons();
          return renderAssets();
        }
        const name = h('input', {
          type: 'text',
          maxlength: 80,
          value: item.name,
          'aria-label': 'Card layer name',
          oninput: event => {
            item.name = event.target.value;
            const activeButton = [...layerButtons.children].find(button => button.dataset.layerKey === 'custom:' + item.id);
            if (activeButton) activeButton.textContent = item.name || 'New layer';
            touch();
          },
        });
        assets.append(h('label', { class: 'f' }, h('span', {}, 'Layer name'), name));
        if (item.image) assets.append(h('img', { src: item.image, alt: '', style: 'max-width:100%;max-height:120px;object-fit:contain' }));

        const uploadInput = h('input', { type: 'file', accept: 'image/png', style: 'display:none' });
        uploadInput.addEventListener('change', async event => {
          const file = event.target.files[0];
          if (!file) return;
          if (file.size > 8_000_000) { alert('Layer PNG too large (max 8 MB)'); return; }
          const url = await upload(file);
          if (!url) return;
          let dimensions;
          try {
            dimensions = await imageDimensions(url);
          } catch (error) {
            alert(error.message);
            return;
          }
          item.image = url;
          item.naturalWidth = dimensions.width;
          item.naturalHeight = dimensions.height;
          item.transform.scale = 1;
          item.transform.x = (canvasWidth - dimensions.width) / 2;
          item.transform.y = (canvasHeight - dimensions.height) / 2;
          touch();
          renderAssets();
          renderCanvasAssets();
        });
        assets.append(
          h('button', { type: 'button', class: 'btn sm', onclick: () => uploadInput.click() }, item.image ? 'Replace PNG' : 'Add PNG'),
          uploadInput,
        );
        const removeButton = h('button', {
          type: 'button',
          class: 'btn sm danger',
          onclick: () => {
            if (!confirm(`Remove the ${item.name || 'new layer'} card layer?`)) return;
            D.bannerLayers = D.bannerLayers.filter(layer => layer.id !== item.id);
            D.bannerDefaults.layerOrder = getLayerOrder().filter(key => key !== 'custom:' + item.id);
            if (selectedComponent && selectedComponent.key === 'custom:' + item.id) {
              selectedComponent = null;
              renderComponentProperties();
            }
            activeLayer = 'background';
            touch();
            renderLayerButtons();
            renderAssets();
            renderCanvasAssets();
          },
        }, 'Remove layer');
        assets.append(removeButton);
        return;
      }

      const [key, title] = categoryMap[activeLayer];
      if (activeLayer === 'badges') {
        const addBadgeHint = h('p', { class: 'help' }, 'Badge PNGs are managed below. Use the three guides on the canvas to position the badge slots.');
        assets.append(addBadgeHint);
        return;
      }
      const items = D[key] = Array.isArray(D[key]) ? D[key] : [];
      const defaultKey = activeLayer === 'background' ? 'background'
        : activeLayer === 'helmet' ? 'helmet'
        : activeLayer === 'torso' ? 'torso'
        : activeLayer === 'stick' ? 'stick'
        : 'puck';
      items.forEach(item => {
        layerTransform(item);
        const button = h('button', {
          type: 'button',
          class: `banner-layer-asset${D.bannerDefaults[defaultKey] === item.id ? ' active' : ''}`,
        });
        if (item.image) button.append(h('img', { src: item.image, alt: '' }));
        button.append(h('span', {}, item.name || title));
        button.addEventListener('click', () => {
          D.bannerDefaults[defaultKey] = item.id;
          selectComponent(`sprite:${item.id}`, item.name || title, layerTransform(item), `sprite:${item.id}`);
          touch();
          renderAssets();
          renderCanvasAssets();
        });
        assets.append(button);
      });
      const uploadInput = h('input', {
        type: 'file',
        accept: 'image/png',
        style: 'display:none',
      });
      uploadInput.addEventListener('change', async event => {
        const file = event.target.files[0];
        if (!file) return;
        if (file.size > 8_000_000) { alert(`${title} PNG too large (max 8 MB)`); return; }
        const url = await upload(file);
        if (!url) return;
        let dimensions;
        try {
          dimensions = await imageDimensions(url);
        } catch (error) {
          alert(error.message);
          return;
        }
        const item = {
          id: uid(), name: `New ${title}`, description: '', image: url,
          naturalWidth: dimensions.width,
          naturalHeight: dimensions.height,
          transform: {
            x: (canvasWidth - dimensions.width) / 2,
            y: (canvasHeight - dimensions.height) / 2,
            scale: 1,
          },
          requirements: {},
          allPlayers: false, season2Players: false, manualPlayerIds: [],
        };
        items.push(item);
        D.bannerDefaults[defaultKey] = item.id;
        touch();
        renderAssets();
        renderCanvasAssets();
      });
      const addButton = h('button', {
        type: 'button',
        class: 'btn sm',
        onclick: () => uploadInput.click(),
      }, `Add ${title} PNG`);
      assets.append(addButton, uploadInput);
    };

    const addLayerButton = h('button', {
      type: 'button',
      class: 'btn sm',
      onclick: () => {
        if (D.bannerLayers.length >= 50) { alert('You can add up to 50 custom card layers.'); return; }
        const item = {
          id: uid(),
          name: `Layer ${D.bannerLayers.length + 1}`,
          image: '',
          naturalWidth: 0,
          naturalHeight: 0,
          transform: { x: 334, y: 510, scale: 1 },
        };
        D.bannerLayers.push(item);
        D.bannerDefaults.layerOrder = getLayerOrder();
        activeLayer = 'custom:' + item.id;
        selectComponent(activeLayer, item.name, item.transform, activeLayer);
        touch();
        renderLayerButtons();
        renderAssets();
        renderCanvasAssets();
      },
    }, 'Add card layer');

    const editorGuidesToggle = h('label', { class: 'banner-editor-preview-toggle' },
      h('input', {
        type: 'checkbox',
        checked: true,
        onchange: event => {
          showEditorGuides = event.target.checked;
          renderLayerButtons();
          renderCanvasAssets();
        },
      }),
      h('span', {}, 'Show editor guides (turn off for card preview)'));
    for (const key of Object.keys(categoryMap)) {
      const [collectionKey] = categoryMap[key];
      const items = D[collectionKey] = Array.isArray(D[collectionKey]) ? D[collectionKey] : [];
      items.forEach(item => layerTransform(item));
    }
    if (previousCanvasVersion < 6) {
      D.bannerDefaults.canvasVersion = 6;
      touch();
    }
    D.bannerLayers.forEach(item => layerTransform(item));
    renderLayerButtons();
    left.append(
      editorGuidesToggle,
      componentProperties,
      layerButtons,
      addLayerButton,
      h('hr'),
      h('strong', {}, 'Imported PNGs'),
      assets,
    );
    wrapper.append(left, canvas);
    renderAssets();
    renderCanvasAssets();
    return wrapper;
  }

  function bannerComponentSection(key, title, action, ...content) {
    const expanded = bannerSectionOpen[key] !== false;
    const indicator = h('span', { 'aria-hidden': 'true' }, expanded ? '−' : '+');
    const body = h('div', { class: 'banner-admin-section-content', hidden: !expanded }, ...content);
    const toggle = h('button', {
      type: 'button',
      class: 'banner-admin-section-toggle',
      'aria-expanded': String(expanded),
      'aria-label': `${expanded ? 'Minimise' : 'Expand'} ${title} section`,
      onclick: event => {
        bannerSectionOpen[key] = !bannerSectionOpen[key];
        const isOpen = bannerSectionOpen[key];
        body.hidden = !isOpen;
        indicator.textContent = isOpen ? '−' : '+';
        event.currentTarget.setAttribute('aria-expanded', String(isOpen));
        event.currentTarget.setAttribute('aria-label', `${isOpen ? 'Minimise' : 'Expand'} ${title} section`);
      },
    }, h('strong', {}, title), indicator);
    return h('section', { class: 'banner-admin-section' },
      h('div', { class: 'banner-admin-section-heading' }, toggle, action),
      body);
  }

  function playerBannerSpriteSection(key, title, defaultKey) {
    const items = D[key] = Array.isArray(D[key]) ? D[key] : [];
    const requirementDefaults = {
      goals: 0, assists: 0, saves: 0, points: 0,
      gamesScoredIn: 0, gamesWith3Goals: 0, gamesWith5Goals: 0,
      gamesWith10Goals: 0, gamesWith100PercentSavePercentage: 0,
      gamesWith10Saves: 0, gamesWith20Saves: 0, gamesWith30Saves: 0,
    };
    const requirementLabels = {
      goals: 'Goals', assists: 'Assists', saves: 'Saves', points: 'Points',
      gamesScoredIn: 'Games with a goal',
      gamesWith3Goals: 'Games with 3+ goals',
      gamesWith5Goals: 'Games with 5+ goals',
      gamesWith10Goals: 'Games with 10+ goals',
      gamesWith100PercentSavePercentage: 'Games with 100% SV%',
      gamesWith10Saves: 'Games with 10+ saves',
      gamesWith20Saves: 'Games with 20+ saves',
      gamesWith30Saves: 'Games with 30+ saves',
    };
    const defaultSelect = h('select', {
      onchange: event => {
        D.bannerDefaults[defaultKey] = event.target.value;
        touch();
      },
    },
      h('option', { value: '', selected: !D.bannerDefaults[defaultKey] }, `No default ${title}`),
      items.map(item => h('option', {
        value: item.id,
        selected: D.bannerDefaults[defaultKey] === item.id,
      }, item.name || title)));
    const defaultsRow = h('div', { class: 'ed', style: 'margin-top:14px' },
      field(`Default ${title}`, defaultSelect, 'Used on every player card until the player equips a sprite.'));

    const cards = items.map(item => {
      item.requirements = { ...requirementDefaults, ...(item.requirements || {}) };
      item.manualPlayerIds = Array.isArray(item.manualPlayerIds) ? item.manualPlayerIds : [];
      item.transform = item.transform && typeof item.transform === 'object'
        ? item.transform : { x: 334, y: 510, scale: 1 };
      item.transform.scale = Math.max(0.1, Math.min(5, Number(item.transform.scale) || 1));
      const uploadInput = h('input', {
        type: 'file', accept: 'image/png', style: 'display:none',
        onchange: async event => {
          const file = event.target.files[0];
          if (!file) return;
          if (file.size > 8_000_000) { alert(`${title} image too large (max 8 MB)`); return; }
          const url = await upload(file);
          if (!url) return;
          let dimensions;
          try {
            dimensions = await imageDimensions(url);
          } catch (error) {
            alert(error.message);
            return;
          }
          item.image = url;
          item.naturalWidth = dimensions.width;
          item.naturalHeight = dimensions.height;
          item.transform = {
            x: (849 - dimensions.width) / 2,
            y: (1200 - dimensions.height) / 2,
            scale: 1,
          };
          touch();
          draw();
        },
      });
      const requirementFields = Object.entries(requirementLabels).map(([requirementKey, label]) =>
        field(label, h('input', {
          type: 'number', min: 0, max: 1000000, step: 1,
          value: item.requirements[requirementKey] || 0,
          oninput: event => {
            const value = Number(event.target.value);
            if (!Number.isSafeInteger(value) || value < 0 || value > 1000000) return;
            item.requirements[requirementKey] = value;
            touch();
          },
        })));
      const scaleControl = bannerScaleControl(item.image, item.transform.scale, value => {
          item.transform.scale = value;
          touch();
          draw();
        }, `sprite:${item.id}`);
      const manualAwards = h('details', { class: 'manual-badge-awards' },
        h('summary', {}, `Manual awards (${item.manualPlayerIds.length})`),
        D.signups.length ? h('div', {}, D.signups.map(signup => h('label', { class: 'checkline' },
          h('input', {
            type: 'checkbox',
            checked: item.manualPlayerIds.includes(signup.id),
            onchange: event => {
              if (event.target.checked) {
                if (!item.manualPlayerIds.includes(signup.id)) item.manualPlayerIds.push(signup.id);
              } else item.manualPlayerIds = item.manualPlayerIds.filter(id => id !== signup.id);
              touch();
            },
          }), `${signup.name}${signup.team ? ` — ${teamName(signup.team)}` : ''}`))) :
          h('p', { class: 'help' }, 'No Season 2 signups are available.'));
      return h('section', { class: 'ed badge-admin-card' },
        h('div', { class: 'row', style: 'grid-template-columns:minmax(0,1fr) auto' },
          field(`${title} name`, text(item, 'name', { maxlength: 80 })),
          h('button', { class: 'btn del sm', type: 'button', onclick: () => {
            if (!confirm(`Delete the ${title.toLowerCase()} "${item.name || title}"?`)) return;
            D[key] = D[key].filter(entry => entry !== item);
            if (D.bannerDefaults[defaultKey] === item.id) D.bannerDefaults[defaultKey] = '';
            touch();
            draw();
          } }, `Delete ${title}`)),
        field('Description', text(item, 'description', { maxlength: 240 })),
        h('div', { class: 'img badge-image-picker' },
          h('span', { class: 'thumb' }, item.image ? h('img', { src: item.image, alt: `${item.name} ${title} preview` }) : 'No image'),
          h('div', {},
            h('div', { class: 'f' }, `${title} PNG`, h('small', {}, 'PNG only; maximum 8 MB.')),
            h('div', { class: 'acts', style: 'justify-content:flex-start' },
              h('button', { class: 'btn line sm', type: 'button', onclick: () => uploadInput.click() }, item.image ? 'Replace PNG' : 'Upload PNG'),
              item.image ? h('button', { class: 'btn del sm', type: 'button', onclick: () => { item.image = ''; touch(); draw(); } }, 'Remove') : null),
            uploadInput)),
        scaleControl,
        h('div', { class: 'badge-requirements' }, requirementFields),
        h('p', { class: 'help', style: 'margin:0' }, 'All non-zero stat thresholds are required together.'),
        h('div', { class: 'badge-audiences' },
          h('label', { class: 'checkline' }, h('input', {
            type: 'checkbox', checked: item.allPlayers,
            onchange: event => { item.allPlayers = event.target.checked; touch(); },
          }), 'All players'),
          h('label', { class: 'checkline' }, h('input', {
            type: 'checkbox', checked: item.season2Players,
            onchange: event => { item.season2Players = event.target.checked; touch(); },
          }), 'Season 2 players')),
        manualAwards);
    });
    const addButton = h('button', { class: 'btn sm', type: 'button', onclick: () => {
          items.push({
            id: uid(), name: `New ${title}`, description: '', image: '',
            transform: { x: 334, y: 510, scale: 1 },
            requirements: { ...requirementDefaults },
            allPlayers: false, season2Players: false, manualPlayerIds: [],
          });
          touch();
          draw();
        } }, `Add ${title}`);
    return bannerComponentSection(key, title, addButton,
      defaultsRow,
      cards.length ? cards : h('div', { class: 'empty' }, h('b', {}, `No ${title.toLowerCase()} yet`), `Press Add ${title} to create one.`));
  }

        field('Description', text(badge, 'description', { maxlength: 240 })),
        h('div', { class: 'img badge-image-picker' },
          h('span', { class: 'thumb' }, badge.image ? h('img', { src: badge.image, alt: `${badge.name} badge preview` }) : 'No image'),
          h('div', {},
            h('div', { class: 'f' }, 'Badge image', h('small', {}, 'PNG only; exactly 400×400 pixels; maximum 8 MB.')),
            h('div', { class: 'acts', style: 'justify-content:flex-start' },
              h('button', { class: 'btn line sm', type: 'button', onclick: () => uploadInput.click() }, badge.image ? 'Replace PNG' : 'Upload PNG'),
              badge.image ? h('button', { class: 'btn del sm', type: 'button', onclick: () => { badge.image = ''; touch(); draw(); } }, 'Remove') : null),
            uploadInput)),
        scaleControl,
        h('div', { class: 'badge-requirements' }, requirementFields),
        h('p', { class: 'help', style: 'margin:0' }, 'All non-zero stat thresholds are required together. Points use the website’s configured points formula.'),
        h('div', { class: 'badge-audiences' },
          h('label', { class: 'checkline' }, h('input', {
            type: 'checkbox', checked: badge.allPlayers,
            onchange: event => { badge.allPlayers = event.target.checked; touch(); },
          }), 'All players'),
          h('label', { class: 'checkline' }, h('input', {
            type: 'checkbox', checked: badge.season2Players,
            onchange: event => { badge.season2Players = event.target.checked; touch(); },
          }), 'Season 2 players')),
        manualAwards);
    });
    const defaultBadgeSelect = h('select', {
      onchange: event => { D.bannerDefaults.badge = event.target.value; touch(); },
    },
      h('option', { value: '', selected: !D.bannerDefaults.badge }, 'No default badge'),
      D.badges.map(badge => h('option', {
        value: badge.id,
        selected: D.bannerDefaults.badge === badge.id,
      }, badge.name || 'Badge')));
    return [
      head('Player Banners'),
      h('p', { class: 'help' }, 'Players can equip unlocked badges and banner sprites in the in-game player card. One global default can be set for each sprite type.'),
      bannerComponentSection('editor', 'Banner Layer Editor', null,
        h('p', { class: 'help' }, 'Uploaded sprite and card-layer PNGs start at native pixel size, centered on the 849 × 1200 canvas. Only the selected component shows a box and X/Y coordinates at its top-left pixel, with the canvas top-left as (0, 0). Select a component to enter exact X/Y and scale values. Drag layers to position and reorder them; use Show/Hide for editor-only visibility. Turn off editor guides for a clean card preview.'),
        bannerLayerEditor()),
      bannerComponentSection('badges', 'Badges', add,
        h('div', { class: 'ed' }, field('Default Badge', defaultBadgeSelect,
          'Shown in slot 1 for every player until they equip a different badge in that slot.')),
        cards.length ? cards : h('div', { class: 'empty' }, h('b', {}, 'No badges yet'), 'Press Add badge to create a collectible.')),
      playerBannerSpriteSection('backgroundSprites', 'Background', 'background'),
      playerBannerSpriteSection('helmetSprites', 'Helmet', 'helmet'),
      playerBannerSpriteSection('torsoSprites', 'Torso', 'torso'),
      playerBannerSpriteSection('stickSprites', 'Stick', 'stick'),
      playerBannerSpriteSection('puckSprites', 'Puck', 'puck'),
    ];
  }

  // news
  function news() {
    const posts = [...D.news].sort((x, y) => y.date.localeCompare(x.date));
    return [
      head('News', h('button', { class: 'btn sm', type: 'button', onclick: () => {
        D.news.push({ id: uid(), title: '', body: '', date: new Date().toISOString().slice(0, 10), pinned: false }); touch(); draw();
      } }, 'Add post')),
      h('p', { class: 'help' }, 'Pinned posts stay at the top. Leave a blank line between paragraphs. Links starting with https:// become clickable. The newest post also shows on the home page.'),
      posts.length ? posts.map(n => h('div', { class: 'ed' },
        h('div', { class: 'row', style: 'grid-template-columns:minmax(0,1fr) 180px auto' },
          field('Title', text(n, 'title', { maxlength: 120 })),
          field('Date', h('input', { type: 'date', value: n.date, oninput: e => { n.date = e.target.value; touch(); } })),
          h('label', { class: 'checkline', style: 'padding-bottom:10px' }, h('input', { type: 'checkbox', checked: n.pinned, onchange: e => { n.pinned = e.target.checked; touch(); } }), 'Pinned')),
        field('Text', h('textarea', { maxlength: 4000, oninput: e => { n.body = e.target.value; touch(); } }, n.body)),
        h('div', { class: 'acts' }, h('button', { class: 'btn del sm', type: 'button', onclick: () => {
          if (!confirm(`Delete the post "${n.title || 'Untitled'}"?`)) return;
          D.news = D.news.filter(x => x !== n); touch(); draw();
        } }, 'Delete post')))) : h('div', { class: 'empty' }, h('b', {}, 'No news yet'), 'Press Add post to write the first one.'),
    ];
  }

  // rules
  function rules() {
    const move = (i, d) => { const j = i + d; [D.rules[i], D.rules[j]] = [D.rules[j], D.rules[i]]; touch(); draw(); };
    return [
      head('Rules', h('button', { class: 'btn sm', type: 'button', onclick: () => { D.rules.push({ id: uid(), title: '', body: '' }); touch(); draw(); } }, 'Add rule')),
      h('p', { class: 'help' }, 'Rules are numbered on the site in this order.'),
      D.rules.length ? D.rules.map((r, i) => h('div', { class: 'ed' },
        field(`Rule ${i + 1} title`, text(r, 'title', { maxlength: 120 })),
        field('Text', h('textarea', { maxlength: 4000, oninput: e => { r.body = e.target.value; touch(); } }, r.body)),
        h('div', { class: 'acts' },
          h('button', { class: 'btn line sm', type: 'button', disabled: i === 0, onclick: () => move(i, -1) }, 'Move up'),
          h('button', { class: 'btn line sm', type: 'button', disabled: i === D.rules.length - 1, onclick: () => move(i, 1) }, 'Move down'),
          h('button', { class: 'btn del sm', type: 'button', onclick: () => {
            if (!confirm(`Delete rule ${i + 1}?`)) return;
            D.rules = D.rules.filter(x => x !== r); touch(); draw();
          } }, 'Delete')))) : h('div', { class: 'empty' }, h('b', {}, 'No rules yet'), 'Press Add rule to write the first one.'),
    ];
  }

  function logs() {
    const entries = Array.isArray(statsImportLogs) ? statsImportLogs : [];
    const dateFormat = new Intl.DateTimeFormat(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit', second: '2-digit',
    });
    const formatDate = value => {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? 'Unknown time' : dateFormat.format(date);
    };
    const count = value => Number.isSafeInteger(value) && value >= 0 ? value : 0;
    const statusLabel = { imported: 'Imported', duplicate: 'Duplicate', failed: 'Failed' };
    return [
      head('Logs', h('button', {
        class: 'btn sm', type: 'button', disabled: statsImportLogsLoading,
        onclick: loadStatsImportLogs,
      }, statsImportLogsLoading ? 'Loading...' : 'Refresh')),
      h('p', { class: 'help' }, 'The latest 500 automatic stats JSON imports from server push and SFTP are shown here. Times use your browser’s local time. Each entry includes the file hash and event totals; a pushed file may not provide its original filename.'),
      statsImportLogsError ? h('p', { class: 'err', role: 'alert' }, statsImportLogsError) : null,
      statsImportLogsLoading ? h('p', { class: 'help', role: 'status' }, 'Loading import logs...') : null,
      !statsImportLogsLoading && !statsImportLogsError && !entries.length
        ? h('div', { class: 'empty' }, h('b', {}, 'No automatic imports yet'), 'Successful uploads, duplicates, and file validation failures will appear here.')
        : null,
      entries.length ? h('div', { class: 'pwrap' }, h('table', { class: 'ptable logtable' },
        h('thead', {}, h('tr', {}, [
          'Date / time', 'Source', 'Server', 'File', 'Status', 'Reports',
          'Events', 'Accepted', 'Credited', 'Unmatched', 'Duplicates', 'SHA-256',
        ].map(label => h('th', { scope: 'col' }, label)))),
        h('tbody', {}, entries.map(entry => {
          const status = ['imported', 'duplicate', 'failed'].includes(entry.status) ? entry.status : 'failed';
          const hash = typeof entry.fileHash === 'string' ? entry.fileHash : '';
          return h('tr', {},
            h('td', {}, formatDate(entry.timestamp)),
            h('td', {}, String(entry.source || '—').toUpperCase()),
            h('td', {}, entry.server || '—'),
            h('td', {}, entry.fileName || 'Not provided'),
            h('td', {}, h('span', { class: 'log-status ' + status }, statusLabel[status]),
              entry.error ? h('small', {}, entry.error) : null),
            h('td', { class: 'tot' }, count(entry.reportCount)),
            h('td', { class: 'tot' }, count(entry.eventCount)),
            h('td', { class: 'tot' }, count(entry.accepted)),
            h('td', { class: 'tot' }, count(entry.credited)),
            h('td', { class: 'tot' }, count(entry.unmatched)),
            h('td', { class: 'tot' }, count(entry.duplicates)),
            h('td', {}, hash ? h('code', { title: hash }, hash.slice(0, 12) + '…') : '—'));
        })))) : null,
    ];
  }

  // settings
  function settings() {
    D.site = D.site || { season: '', discord: '' };
    D.site.statsPointRequirements = D.site.statsPointRequirements || { goals: 1, assists: 1, saves: 2 };
    const requirements = D.site.statsPointRequirements;
    const requirementInput = (key, label) => field(label, h('input', {
      type: 'number', min: 1, max: 100000, step: 1, required: true,
      value: requirements[key],
      oninput: e => {
        const value = Number(e.target.value);
        if (!Number.isSafeInteger(value) || value < 1 || value > 100000) return;
        requirements[key] = value;
        touch();
      },
      onchange: e => {
        const value = Number(e.target.value);
        if (!Number.isSafeInteger(value) || value < 1 || value > 100000)
          e.target.value = requirements[key];
      },
    }));
    return [
      head('Settings'),
      h('div', { class: 'ed', style: 'max-width:640px' },
        field('Season name', text(D.site, 'season', { maxlength: 40, placeholder: 'Season 1' }), 'Shows on the home page.'),
        field('Discord invite link', text(D.site, 'discord', { maxlength: 300, placeholder: 'https://discord.gg/...' }), 'Must start with https://. Leave empty to hide the Join the Discord button.'),
        h('div', { class: 'point-requirements' },
          requirementInput('goals', 'Goals per point'),
          requirementInput('assists', 'Assists per point'),
          requirementInput('saves', 'Saves per point')),
        h('p', { class: 'help', style: 'margin:0' }, 'Skaters earn points from goals and assists; goalies earn points from saves and assists. Each configured threshold awards one point. Defaults are 1 goal, 1 assist, and 2 saves. Values must be whole numbers from 1 to 100,000.'),
        h('p', { class: 'help', style: 'margin:0' }, D.hasLogo ? `The league logo (${D.logoUrl.slice(1)}) is in use.` : 'No league logo yet: the site shows the MHL wordmark. To add one, put logo.png (or logo.webp / logo.jpg) next to server.js and reload the site.')),
      h('div', { class: 'ed', style: 'max-width:640px' },
        h('b', {}, 'Full site backup'),
        h('p', { class: 'help' }, 'Download all saved site entries, statistics, and uploaded images in one JSON file. The file does not include website source code or server secrets.'),
        h('button', {
          class: 'btn sm', type: 'button',
          onclick: event => downloadSiteBackup(event.currentTarget),
        }, 'Download full site backup'),
        h('p', { id: 'backupStatus', class: 'help', role: 'status', 'aria-live': 'polite' })),
    ];
  }

  return { start, login, check: async () => ((await (await fetch('/api/me')).json()).admin ? start() : login()) };
})();
MHLA.check();
</script>
</body>
</html>

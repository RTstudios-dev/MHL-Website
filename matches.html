<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matches | MHL</title>
<meta name="description" content="Every MHL series: fixtures, results and game-by-game scores.">
<meta property="og:type" content="website">
<meta property="og:title" content="Matches | MHL">
<meta property="og:description" content="Every MHL series: fixtures, results and game-by-game scores.">
<meta name="theme-color" content="#111013">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="app">
<aside class="side" id="side"></aside>
<div>
<header class="mtop" id="mtop"></header>
<main class="main" id="main">
<div class="ph">
  <h1>Matches</h1>
  <p>Regular-season and Quarter Finals are best-of-3, Semi Finals are best-of-5, and Finals are best-of-7. Regular-season points are 3 for a 2-0 win and 2-1 for a 2-1 win. Playoff results show who advances or wins the championship and are excluded from regular-season statistics.</p>
</div>
<div class="seg" id="seasons" role="group" aria-label="Match season"></div>
<div class="seg" id="rounds" role="group" aria-label="Round" hidden></div>
<div id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
</main>
</div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="more" id="more" hidden></div>
<script src="/standings.js"></script>
<script src="/site.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  let D;
  try { D = await MHL.load(); } catch { return MHL.fail($('list'), 'the matches'); }
  const { esc } = MHL;
  D.season2Rounds = Array.isArray(D.season2Rounds) ? D.season2Rounds : [];
  D.season2Matches = Array.isArray(D.season2Matches) ? D.season2Matches : [];
  let season = new URLSearchParams(location.search).get('season') === 'season2' ? 'season2' : 'season1';
  let pick = new URLSearchParams(location.search).get('round') || 'all';

  function updateUrl() {
    const params = new URLSearchParams(location.search);
    if (season === 'season2') params.set('season', season);
    else params.delete('season');
    if (pick === 'all') params.delete('round');
    else params.set('round', pick);
    const query = params.toString();
    history.replaceState(null, '', location.pathname + (query ? '?' + query : ''));
  }

  function draw() {
    const seasonData = season === 'season2'
      ? { ...D, rounds: D.season2Rounds, matches: D.season2Matches }
      : D;
    seasonData.R = Object.fromEntries(seasonData.rounds.map(round => [round.id, round]));
    const groups = seasonData.rounds.map(round => ({
      id: round.id,
      name: round.name,
      ms: seasonData.matches.filter(match => match.round === round.id),
    }));
    const loose = seasonData.matches.filter(match => !seasonData.R[match.round]);
    if (loose.length) groups.push({
      id: '_none',
      name: seasonData.rounds.length ? 'Other matches' : 'All matches',
      ms: loose,
    });
    const used = groups.filter(group => group.ms.length);
    if (pick !== 'all' && !used.some(group => group.id === pick)) pick = 'all';

    $('seasons').innerHTML = [
      ['season1', 'Season 1 matches'],
      ['season2', 'Season 2 matches'],
    ].map(([value, label]) => `<button type="button" data-season="${value}" aria-pressed="${value === season}">${label}</button>`).join('');
    $('rounds').hidden = used.length <= 1;
    $('rounds').innerHTML = used.length > 1
      ? [{ id: 'all', name: 'All' }, ...used].map(group =>
        `<button type="button" data-r="${esc(group.id)}" aria-pressed="${group.id === pick}">${esc(group.name)}</button>`).join('')
      : '';
    if (!used.length) {
      $('list').innerHTML = MHL.empty(
        season === 'season2' ? 'No Season 2 matches yet' : 'No matches yet',
        'Fixtures and results appear here once they are added.',
      );
      return;
    }
    const show = pick === 'all' ? used : used.filter(g => g.id === pick);
    $('list').innerHTML = show.map(group => `<section class="block"><div class="bh"><h2>${esc(group.name)}</h2></div>
      <div class="sbs">${[...group.ms].sort(MHL.byDate).map(match => MHL.scoreboard(match, seasonData)).join('')}</div></section>`).join('');
  }
  $('seasons').addEventListener('click', event => {
    const button = event.target.closest('button[data-season]');
    if (!button) return;
    season = button.dataset.season;
    pick = 'all';
    updateUrl();
    draw();
  });
  $('rounds').addEventListener('click', e => {
    const b = e.target.closest('button[data-r]'); if (!b) return;
    pick = b.dataset.r;
    updateUrl();
    draw();
  });
  draw();
})();
</script>
</body>
</html>

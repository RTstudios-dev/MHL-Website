<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Season 2 Player Sign Ups | MHL</title>
<meta name="description" content="Season 2 player sign ups for the Miniature Hockey League.">
<meta name="theme-color" content="#111013">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
.sortbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.sortbar label{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.sortbar select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:9px 12px;min-height:44px}
.sortbar .signup-search{display:grid;flex:1;max-width:320px;gap:4px}
.sortbar input{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);padding:9px 12px;min-height:44px;width:100%}
.signup-person{display:flex;align-items:center;gap:12px;min-width:0}
.signup-person img,.avatar{width:42px;height:42px;flex:none;object-fit:cover;border:1px solid var(--line);border-radius:50%;background:var(--paper)}
.avatar{display:grid;place-items:center;color:var(--gold);font-family:var(--disp);font-size:22px}
.signup-team-display{display:inline-flex;align-items:center;gap:8px}
.signup-team-display .badge{width:30px;height:30px}
.signup-team-tag{display:inline-flex;align-items:center;min-height:26px;padding:2px 8px;border:1px solid var(--line);color:var(--gold);font-size:11px;letter-spacing:.08em;white-space:nowrap}
.signup-wrap{overflow:visible}
.signup-table{width:100%;min-width:0;table-layout:fixed}
.signup-table th,.signup-table td{padding-right:7px;padding-left:7px;overflow-wrap:anywhere}
.signup-table th{white-space:normal}
.signup-table.has-action th:last-child,.signup-table.has-action td:last-child{width:88px}
.signup-table.has-action th:nth-child(1),.signup-table.has-action td:nth-child(1){width:17%}
.signup-table.has-action th:nth-child(2),.signup-table.has-action td:nth-child(2){width:15%}
.signup-table.has-action th:nth-child(3),.signup-table.has-action td:nth-child(3){width:8%}
.signup-table.has-action th:nth-child(4),.signup-table.has-action td:nth-child(4){width:9%}
.signup-table.has-action th:nth-child(5),.signup-table.has-action td:nth-child(5){width:8%}
.signup-table.has-action th:nth-child(6),.signup-table.has-action td:nth-child(6){width:11%}
.signup-table.has-action th:nth-child(7),.signup-table.has-action td:nth-child(7){width:10%}
.signup-table.has-action th:nth-child(8),.signup-table.has-action td:nth-child(8){width:10%}
.signup-table .name-cell{min-width:0}
.signup-table .signup-person b{min-width:0;overflow-wrap:anywhere}
.signup-table .edit-cell{width:1%;white-space:nowrap}
.own-signup .signup-table.has-action th:last-child,.own-signup .signup-table.has-action td:last-child{width:160px}
.signup-table .value-cell{font-family:var(--disp);font-size:24px;color:var(--gold)}
.pick-btn[disabled]{opacity:.45;cursor:default}
.captain-unavailable{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.draft-budget-overlay{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;z-index:1000;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100vw - 24px);padding:10px 18px;border:1px solid var(--gold);background:var(--paper);box-shadow:0 6px 24px #0009;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
.draft-budget-overlay strong{color:var(--gold);font-family:var(--disp);font-size:24px;font-weight:500;letter-spacing:0}
.draft-budget-overlay[hidden]{display:none}
.own-signup{margin-bottom:40px}
.cap-banner{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 30px}
.cap-item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper);border:1px solid var(--line);padding:14px 18px}
.cap-item span{color:var(--muted);font-size:14px}
.cap-item strong{font-family:var(--disp);font-weight:500;font-size:26px;color:var(--gold)}
.sign-in-entry{width:100%;min-height:84px;font-size:14px}
@media(max-width:700px){
  .signup-table,.signup-table tbody{display:block;width:100%;min-width:0}
  .signup-table thead{display:none}
  .signup-table tbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;padding:0 12px;border-bottom:1px solid var(--line)}
  .signup-table tbody td{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:10px 4px;text-align:left;border:0}
  .signup-table tbody td::before{content:attr(data-label);margin-bottom:4px;color:var(--muted);font-family:var(--body);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
  .signup-table .name-cell{grid-column:1/-1}
  .signup-table .edit-cell{grid-column:1/-1;display:flex;flex-direction:row;align-items:center;gap:8px;width:auto;padding-top:12px;border-top:1px solid var(--line)}
  .signup-table .edit-cell::before{margin:0 auto 0 0}
  .signup-table .signup-person{gap:8px}
  .signup-table .signup-person img,.signup-table .avatar{width:34px;height:34px}
  .signup-table .value-cell{font-size:20px}
}
@media(max-width:560px){.draft-budget-overlay{top:max(8px,env(safe-area-inset-top));padding:8px 12px;font-size:10px}.draft-budget-overlay strong{font-size:21px}.sortbar{align-items:flex-start;flex-direction:column}.sortbar label{width:100%;align-items:flex-start;flex-direction:column}.sortbar select{width:100%}.cap-banner{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"></aside>
<div>
<header class="mtop" id="mtop"></header>
<main class="main" id="main">
<div class="ph">
  <h1>Season 2 Player Sign Ups</h1>
  <p>Player signups and their Season 2 details.</p>
</div>
<section class="own-signup" aria-labelledby="ownSignupTitle">
  <div class="bh"><h2 id="ownSignupTitle">Your Season 2 Entry</h2></div>
  <div id="yourEntry"><div class="sk"></div></div>
</section>
<section class="cap-banner" aria-label="Season 2 caps">
  <div class="cap-item"><span>Ice Cap €</span><strong id="iceCapValue">€0</strong></div>
  <div class="cap-item"><span>Team Cap €</span><strong id="teamCapValue">€0</strong></div>
</section>
<div class="sortbar">
  <p id="count" class="note" style="margin:0"></p>
  <label for="sort">Sort signups
    <select id="sort">
      <option value="captains">Potential Captains</option>
      <option value="hours-desc">Highest Hours</option>
      <option value="hours-asc">Lowest Hours</option>
      <option value="value-desc" selected>Highest Value</option>
      <option value="value-asc">Lowest Value</option>
    </select>
  </label>
  <label class="signup-search" for="playerSearch">Search Season 2 players
    <input id="playerSearch" type="search" autocomplete="off">
  </label>
</div>
<div id="players"><div class="sk"></div></div>
<p id="draftNotice" class="note" role="status" hidden></p>
</main>
</div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="more" id="more" hidden></div>
<div id="draftBudgetOverlay" class="draft-budget-overlay" role="status" aria-live="polite" hidden></div>
<dialog id="yourPickPopup" class="prompt-dialog" aria-labelledby="yourPickTitle">
  <h2 id="yourPickTitle">It’s your pick!</h2>
  <p>Choose a player from the list below.</p>
  <div class="actions">
    <button id="goToSeasonPlayers" class="btn" type="button">Go To Season 2 players</button>
    <button id="dismissYourPick" class="btn line" type="button">Dismiss</button>
  </div>
</dialog>
<script src="/standings.js"></script>
<script src="/site.js"></script>
<script>
(async () => {
  const host = document.getElementById('players');
  const ownHost = document.getElementById('yourEntry');
  const draftNotice = document.getElementById('draftNotice');
  const budgetOverlay = document.getElementById('draftBudgetOverlay');
  const yourPickPopup = document.getElementById('yourPickPopup');
  const select = document.getElementById('sort');
  const searchInput = document.getElementById('playerSearch');
  const signups = () => window.seasonSignups || [];
  let draftState = { active: false, captainTeamId: '', captainSignupIds: [], currentTeamId: '', pickedSignupIds: [], teamBudgets: {} };
  let pollingDraft = false, pickingPlayer = false, signupRefreshPending = false, signupSearch = '';
  let wasYourTurn = false, observedTurnKey = '';
  const capFormat = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  const averageValueFormat = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'EUR', minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const formatCap = raw => {
    const value = Number(raw);
    return capFormat.format(Number.isSafeInteger(value) && value >= 0 ? value : 0);
  };
  const updateBudgetOverlay = () => {
    if (!draftState.active || !draftState.captainTeamId) {
      budgetOverlay.hidden = true;
      budgetOverlay.textContent = '';
      return;
    }
    const budget = draftState.teamBudgets[draftState.captainTeamId];
    budgetOverlay.innerHTML = `Your draft budget <strong>${MHL.esc(formatCap(budget))}</strong>`;
    budgetOverlay.hidden = false;
  };
  const drawCaps = site => {
    document.getElementById('iceCapValue').textContent = formatCap(site.iceCap);
    document.getElementById('teamCapValue').textContent = formatCap(site.teamCap);
  };
  const valueFormat = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  const compactValueFormat = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'EUR', notation: 'compact', maximumFractionDigits: 1 });
  const formatValue = raw => {
    const value = Number(raw) || 0;
    if (!value) return '—';
    return value >= 1_000_000
      ? compactValueFormat.format(value).replace(/([KMBT])$/, (_, suffix) => suffix.toLowerCase())
      : valueFormat.format(value);
  };
  let teams = [];
  let ownSignupId = '';
  const teamDisplay = player => {
    const team = teams.find(item => item.id === player.team);
    if (!team) return '—';
    const tag = team.logo ? `<b class="signup-team-tag">${MHL.esc(MHL.code(team))}</b>` : '';
    return `<span class="signup-team-display" title="${MHL.esc(team.name)}">${MHL.badge(team)}${tag}</span>`;
  };
  const draftPrice = player => {
    const skater = Number(player.skaterValue ?? player.value) || 0;
    const goalie = Number(player.goalieValue ?? player.value) || 0;
    return Math.max(skater, goalie);
  };
  const showPickControls = () => draftState.active && !!draftState.captainTeamId;
  const pickButton = player => {
    if ((draftState.captainSignupIds || []).includes(player.id)) {
      return '<span class="captain-unavailable" aria-label="Team captains cannot be drafted">Captain</span>';
    }
    const picked = draftState.pickedSignupIds.includes(player.id);
    const budget = Number(draftState.teamBudgets[draftState.captainTeamId]) || 0;
    const disabled = draftState.currentTeamId !== draftState.captainTeamId || picked || draftPrice(player) > budget;
    return `<button class="btn pick-btn" type="button" data-pick-signup="${MHL.esc(player.id)}"
      aria-label="Pick ${MHL.esc(player.name)}"${disabled ? ' disabled' : ''}>Pick</button>`;
  };
  const pickCell = player => `<td class="edit-cell" data-label="Draft pick">${pickButton(player)}</td>`;
  const playerCells = player => `<td class="l name-cell" data-label="Player"><span class="signup-person">${player.photo
    ? `<img src="${MHL.esc(player.photo)}" alt="">`
    : `<span class="avatar" aria-hidden="true">${MHL.esc((player.name || '?').slice(0, 1).toUpperCase())}</span>`}
    <b>${MHL.esc(player.name)}</b></span></td>
    <td class="l" data-label="Discord Username">${MHL.esc(player.discord)}</td><td data-label="Hours on Puck">${Number(player.hours) || 0}</td>
    <td data-label="Position">${MHL.esc(player.position || '—')}</td><td data-label="Captain?">${MHL.esc(player.captain || '—')}</td>
    <td class="l" data-label="Team">${teamDisplay(player)}</td>
    <td class="value-cell" data-label="Skater Value">${formatValue(player.skaterValue ?? player.value)}</td>
    <td class="value-cell" data-label="Goalie Value">${formatValue(player.goalieValue ?? player.value)}</td>`;
  const tableHead = (action, actionLabel = 'Edit entry') => `<thead><tr><th class="l" scope="col">Player</th><th class="l" scope="col">Discord Username</th>
    <th scope="col">Hours on Puck</th><th scope="col">Position</th><th scope="col">Captain?</th>
    <th class="l" scope="col">Team</th><th scope="col">Skater Value (€)</th><th scope="col">Goalie Value (€)</th>
    ${action ? `<th scope="col" aria-label="${MHL.esc(actionLabel)}"></th>` : ''}</tr></thead>`;

  function draw() {
    const query = signupSearch.trim().toLocaleLowerCase();
    const list = signups().filter(player => player.id !== ownSignupId && (!query || [
      player.name, player.discord, player.position, player.captain,
      (teams.find(team => team.id === player.team) || {}).name,
    ].some(value => String(value || '').toLocaleLowerCase().includes(query))));
    const byName = (a, b) => a.name.localeCompare(b.name) || a.discord.localeCompare(b.discord);
    const captainRank = { Yes: 0, Maybe: 1, No: 2 };
    const valueOf = player => Math.max(Number(player.skaterValue ?? player.value) || 0, Number(player.goalieValue ?? player.value) || 0);
    const sorters = {
      captains: (a, b) => captainRank[a.captain] - captainRank[b.captain] || byName(a, b),
      'hours-desc': (a, b) => b.hours - a.hours || byName(a, b),
      'hours-asc': (a, b) => a.hours - b.hours || byName(a, b),
      'value-desc': (a, b) => valueOf(b) - valueOf(a) || byName(a, b),
      'value-asc': (a, b) => valueOf(a) - valueOf(b) || byName(a, b),
    };
    list.sort(sorters[select.value]);
    const totalSignups = signups().length;
    const averageValue = key => {
      const valueOf = (player, valueKey) => Number(player[valueKey] ?? player.value) || 0;
      const eligible = signups().filter(player => key === 'goalieValue'
        ? player.position === 'Goalie'
        : player.position !== 'Goalie');
      if (!eligible.length) return '—';
      const average = eligible.reduce((sum, player) => sum + valueOf(player, key), 0) / eligible.length;
      return averageValueFormat.format(Math.ceil(average / 100000) * 100000);
    };
    document.getElementById('count').textContent = `${totalSignups} ${totalSignups === 1 ? 'signup' : 'signups'} (est possible teams ${Math.floor(totalSignups / 8)}) · Avg Skater Value ${averageValue('skaterValue')} · Avg Goalie Value ${averageValue('goalieValue')}`;
    if (!list.length) {
      host.innerHTML = query
        ? MHL.empty('No players match your search', 'Try another player name, Discord username, position or team.')
        : MHL.empty('No Season 2 signups yet', 'Use Sign Up Here to add the first player.');
      return;
    }
    const showPick = showPickControls();
    host.innerHTML = `<div class="tbl-wrap signup-wrap"><table class="tbl signup-table${showPick ? ' has-action' : ''}">${tableHead(showPick, 'Draft pick')}
      <tbody>${list.map(player => `<tr>${playerCells(player)}${showPick ? pickCell(player) : ''}</tr>`).join('')}</tbody>
    </table></div>`;
  }
  async function loadDraftState() {
    const response = await fetch('/api/draft', { cache: 'no-store' });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Could not load draft status.');
    const turnKey = JSON.stringify(result.pickedSignupIds || []);
    const isYourTurn = !!result.active && !!result.captainTeamId && result.currentTeamId === result.captainTeamId;
    if (isYourTurn && (!wasYourTurn || turnKey !== observedTurnKey) && !yourPickPopup.open) yourPickPopup.showModal();
    wasYourTurn = isYourTurn;
    observedTurnKey = turnKey;
    draftState = result;
    updateBudgetOverlay();
    if (result.complete)     draftNotice.textContent = 'The draft has no eligible affordable players remaining.';
    else draftNotice.textContent = '';
    draftNotice.hidden = !draftNotice.textContent;
  }
  async function loadPublicData() {
    const response = await fetch('/api/data', { cache: 'no-store' });
    if (!response.ok) throw new Error('Could not refresh the Season 2 players.');
    const data = await response.json();
    window.seasonSignups = Array.isArray(data.signups) ? data.signups : [];
    teams = Array.isArray(data.teams) ? data.teams : [];
    return data;
  }
  async function refreshDraftState() {
    if (pollingDraft || pickingPlayer || document.hidden) return;
    pollingDraft = true;
    const previous = draftState;
    try {
      await loadDraftState();
      const stateChanged = JSON.stringify(previous) !== JSON.stringify(draftState);
      const picksChanged = (previous.pickedSignupIds || []).join('|') !== (draftState.pickedSignupIds || []).join('|');
      if (picksChanged) signupRefreshPending = true;
      let dataChanged = false;
      if (signupRefreshPending) {
        try {
          await loadPublicData();
          signupRefreshPending = false;
          dataChanged = true;
        } catch (error) {
          draftNotice.textContent = error.message || 'Could not refresh the Season 2 players.';
          draftNotice.hidden = false;
        }
      }
      if (stateChanged || dataChanged) {
        draw();
        if (dataChanged || previous.active !== draftState.active || previous.captainTeamId !== draftState.captainTeamId) await loadOwnEntry();
      }
    } catch (error) {
      draftNotice.textContent = error.message || 'Could not refresh draft status.';
      draftNotice.hidden = false;
    } finally {
      pollingDraft = false;
    }
  }
  async function pickPlayer(signupId, button) {
    if (pickingPlayer) return;
    pickingPlayer = true;
    let pickSaved = false;
    button.disabled = true;
    draftNotice.hidden = true;
    try {
      const response = await fetch('/api/draft/pick', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ signupId }),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Could not draft that player.');
      pickSaved = true;
      signupRefreshPending = true;
      await loadPublicData();
      signupRefreshPending = false;
      await loadDraftState();
      draw();
      await loadOwnEntry();
    } catch (error) {
      if (pickSaved) {
        try {
          await loadDraftState();
          draw();
        } catch (refreshError) {
          draftNotice.textContent = refreshError.message || 'The pick was saved, but draft status could not be refreshed.';
        }
      }
      if (!draftNotice.textContent || draftNotice.hidden) {
        draftNotice.textContent = pickSaved ? 'The pick was saved, but the signup list could not be refreshed.' : error.message || 'Could not complete the draft pick.';
      }
      draftNotice.hidden = false;
      if (!pickSaved) button.disabled = false;
    } finally {
      pickingPlayer = false;
    }
  }
  async function loadOwnEntry() {
    try {
      const sessionResponse = await fetch('/api/player/me', { cache: 'no-store' });
      if (!sessionResponse.ok) throw new Error('Could not check Steam sign-in.');
      const session = await sessionResponse.json();
      if (!session.authenticated) {
        ownHost.innerHTML = '<a class="btn sign-in-entry" href="/player-login">Sign in to edit entry</a>';
        return;
      }
      const response = await fetch('/api/player/signup', { cache: 'no-store' });
      const result = await response.json();
      if (response.status === 404) {
        ownHost.innerHTML = '<a class="btn sign-in-entry" href="/sign-up">Sign up for Season 2</a>';
        return;
      }
      if (!response.ok) throw new Error(result.error || 'Could not load your entry.');
      ownSignupId = result.signup.id;
      ownHost.innerHTML = `<div class="tbl-wrap signup-wrap"><table class="tbl signup-table has-action">${tableHead(true)}
        <tbody><tr>${playerCells(result.signup)}<td class="edit-cell" data-label="Actions"><a class="btn" href="/player-login">Edit</a></td></tr></tbody>
      </table></div>`;
    } catch (error) {
      ownHost.innerHTML = MHL.empty('Could not load your entry', error.message || 'Please reload and try again.');
    }
  }
  searchInput.addEventListener('input', () => {
    signupSearch = searchInput.value;
    draw();
  });
  select.addEventListener('change', draw);
  const handlePickClick = event => {
    const button = event.target.closest('[data-pick-signup]');
    if (button && !button.disabled) pickPlayer(button.dataset.pickSignup, button);
  };
  document.getElementById('goToSeasonPlayers').addEventListener('click', () => {
    yourPickPopup.close();
    document.getElementById('players').scrollIntoView({ behavior: 'smooth' });
  });
  document.getElementById('dismissYourPick').addEventListener('click', () => yourPickPopup.close());
  host.addEventListener('click', handlePickClick);
  ownHost.addEventListener('click', handlePickClick);
  let data;
  try { data = await loadPublicData(); } catch {
    return MHL.fail(host, 'the Season 2 players');
  }
  drawCaps(data.site || {});
  try {
    await loadDraftState();
  } catch (error) {
    draftNotice.textContent = error.message || 'Could not load draft status.';
    draftNotice.hidden = false;
  }
  draw();
  await loadOwnEntry();
  draw();
  window.setInterval(refreshDraftState, 3000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshDraftState();
  });
})();
</script>
</body>
</html>
